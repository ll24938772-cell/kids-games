/* ═══════════ 遊戲八：天平 ═══════════ */
const MONW=[["🐝",1],["⚡",1],["🥚",2],["🍄",2],["🦊",3],["🐙",3],["🐢",4],["🦖",6],["🐲",7],["🗿",8]];
function combo(pool,target,maxLen){          /* 從 pool 裡找加起來剛好 target 的組合 */
  const res=[];
  (function go(i,left,acc){
    if(res.length) return;
    if(left===0&&acc.length){ res.push(acc.slice()); return; }
    if(i>=pool.length||acc.length>=maxLen||left<0) return;
    go(i+1,left-pool[i][1],acc.concat([i]));
    go(i+1,left,acc);
  })(0,target,[]);
  return res[0]||null;
}
function buildScale(){
  let fixed=null, sol=null, tray=null, T=0;
  for(let t=0;t<60 && !fixed;t++){
    const pool=shuffle(MONW.slice());
    const solN=2+(Math.random()*2|0);                 /* 答案用 2～3 隻 */
    sol=pool.slice(0,solN);
    T=sol.reduce((a,m)=>a+m[1],0);
    if(T<3||T>12){ fixed=null; continue; }
    const rest=pool.slice(solN);
    const idx=combo(rest,T,2);                        /* 固定那邊用 1～2 隻 */
    if(idx) fixed=idx.map(i=>rest[i]);
    if(fixed){
      const spare=rest.filter((_,i)=>!idx.includes(i));
      tray=shuffle(sol.concat(spare.slice(0,2)));
    }
  }
  if(!fixed){ fixed=[["🗿",8]]; sol=[["🦖",6],["🥚",2]]; T=8; tray=shuffle(sol.concat([["🦊",3],["🐝",1]])); }

  const mon=(e,w,cls)=>`<span class="mon${cls?" "+cls:""}" data-w="${w}" data-e="${e}">${e}<i class="wt">${w}</i></span>`;
  stage.innerHTML=`<div class="scalew"><div class="scaleTop">
      <div class="stand"></div>
      <div class="beam" style="--deg:0deg">
        <div class="pan l"><div class="rope"></div><div class="dish" data-s="l">${fixed.map(m=>mon(m[0],m[1])).join("")}</div></div>
        <div class="pan r"><div class="rope"></div><div class="dish" data-s="r"></div></div>
      </div></div>
      <div class="pool">${tray.map(m=>mon(m[0],m[1])).join("")}</div></div>`;
  const wrap=stage.querySelector(".scalew"), beam=stage.querySelector(".beam");
  const dishR=stage.querySelector('.dish[data-s="r"]'), pool=stage.querySelector(".pool");
  const sumOf=el=>[...el.querySelectorAll(".mon")].reduce((a,m)=>a+ +m.dataset.w,0);
  let settled=false;
  function refresh(){
    const R=sumOf(dishR), d=Math.max(-1,Math.min(1,(R-T)/Math.max(T,1)));
    beam.style.setProperty("--deg",(d*14).toFixed(1)+"deg");
    stage.querySelectorAll(".pan").forEach(p=>p.style.setProperty("--deg",(d*14).toFixed(1)+"deg"));
    if(R===T && !settled){
      settled=true; sfx.cheer(); say("一樣重了");
      setTimeout(nextRound,1600);
    }
  }
  wrap.addEventListener("click",e=>{
    audio();
    const m=e.target.closest(".mon"); if(!m||settled) return;
    if(m.closest(".pool")){                            /* 從料架放到右盤 */
      if(m.classList.contains("used")) return;
      const c=m.cloneNode(true); c.dataset.from=[...pool.children].indexOf(m);
      m.classList.add("used"); dishR.appendChild(c); sfx.step(1);
    }else if(m.closest('.dish[data-s="r"]')){          /* 從右盤拿回來 */
      const i=+m.dataset.from; const src=pool.children[i];
      if(src) src.classList.remove("used");
      m.remove(); sfx.tap();
    }else return;
    refresh();
  });
  refresh();
  return null;
}

/* ═══════════ 遊戲九：湊十 ═══════════ */
function buildTen(){
  /* 用不重複的 a 產生 6 組，才不會整盤都是 4+6，也保證有 1+9、3+7 這種奇數組 */
  const P=6, nums=[];
  shuffle([1,2,3,4,5,6,7,8,9]).slice(0,P).forEach(a=>nums.push(a,10-a));
  const deck=shuffle(nums);
  const cols=4;
  stage.innerHTML=`<div class="tenw" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">`+
    deck.map((n,i)=>`<div class="tcard" data-i="${i}" data-n="${n}"><span class="n">${n}</span>`+
      `<span class="dots">${"<i></i>".repeat(n)}</span></div>`).join("")+`</div>`;
  const w=stage.querySelector(".tenw");
  w.style.aspectRatio = cols+" / "+Math.ceil(deck.length/cols);
  let sel=null, left=P;
  w.addEventListener("click",e=>{
    audio();
    const c=e.target.closest(".tcard");
    if(!c||c.classList.contains("gone")) return;
    if(c===sel){ c.classList.remove("pick"); sel=null; return; }
    if(!sel){ sel=c; c.classList.add("pick"); sfx.tap(); return; }
    const s=+sel.dataset.n + +c.dataset.n;
    if(s===10){
      const x=sel; sel=null; x.classList.remove("pick");
      x.classList.add("gone"); c.classList.add("gone");
      sfx.yes(); say(zh(+x.dataset.n)+"加"+zh(+c.dataset.n)+"等於十");
      if(--left===0) setTimeout(()=>{ sfx.cheer(); setTimeout(nextRound,900); },600);
    }else{
      c.classList.add("nudge"); sel.classList.add("nudge");
      const x=sel; setTimeout(()=>{ c.classList.remove("nudge"); x.classList.remove("nudge"); },440);
      sel.classList.remove("pick"); sel=null; sfx.soft();
    }
  });
  return null;
}

/* ═══════════ 遊戲十一：尺分兩堆 ═══════════
   一堆同樣的樹果，用一把尺推開成兩堆，尺停在哪裡就是分界。
   推完按「數一數」，唸出 12 = 5 + 7 —— 這是數的分解，加減法的底。 */
function buildRuler(){
  const n = 8 + (Math.random()*7|0);                 /* 8～14 顆 */
  const kind = Math.random()<.5?"r":"g";
  stage.innerHTML=`<div class="rulerw"></div>
    <div class="rulerbar"><button class="btn" id="countBtn">數一數</button></div>`;
  stage.style.flexDirection="column";
  const box=stage.querySelector(".rulerw");
  const W=box.clientWidth, H=box.clientHeight;
  const S=Math.max(20,Math.min(44, Math.min(W,H)*0.075*Math.sqrt(10/n)));
  const RW=Math.max(24,Math.min(38,W*0.036));        /* 尺的寬度 */
  const pad=S;

  /* 樹果一開始混在中間；hx 是它原本的位置，尺經過時才被撥開，尺走了就回去 */
  for(let i=0;i<n;i++){
    const b=document.createElement("div");
    b.className="bean"; b.dataset.t=kind;
    const x=W*.18+Math.random()*W*.64, y=H*.18+Math.random()*H*.64;
    b.dataset.hx=x;
    b.style.cssText=`left:${x}px;top:${y}px;width:${S}px;height:${S*.82}px;--r:${(Math.random()*60-30)|0}deg`;
    box.appendChild(b);
  }
  const beans=[...box.querySelectorAll(".bean")];

  const ruler=document.createElement("div");
  ruler.className="ruler";
  let rx=W*0.10;                                     /* 尺一開始放在左邊，讓小孩自己推過去 */
  ruler.style.left=rx+"px";
  box.appendChild(ruler);

  /* 尺是分界線：經過的樹果往它原本那一側被撥開，尺移走就回到原位。
     所以尺往右滑 → 左邊那堆變多，兩堆的數字跟著變，這就是數的分解。 */
  const half=RW/2+S*0.55;
  function layout(){
    beans.forEach(b=>{
      const hx=+b.dataset.hx, d=hx-rx;
      const nx = Math.abs(d)<half ? rx+(d<0?-half:half) : hx;
      b.style.left=Math.max(pad,Math.min(W-pad,nx))+"px";
    });
  }
  let pid=null, grabDx=0, busy=false;
  ruler.addEventListener("pointerdown",e=>{
    if(pid!==null||busy) return;
    audio(); pid=e.pointerId;
    grabDx=e.clientX-box.getBoundingClientRect().left-rx;
    ruler.classList.add("grab");
    try{ ruler.setPointerCapture(e.pointerId); }catch(err){}
  });
  ruler.addEventListener("pointermove",e=>{
    if(e.pointerId!==pid) return;
    const b=box.getBoundingClientRect();
    rx=Math.max(RW/2+2, Math.min(W-RW/2-2, e.clientX-b.left-grabDx));
    ruler.style.left=rx+"px";
    layout();
  });
  const end=e=>{ if(e.pointerId===pid){ pid=null; ruler.classList.remove("grab"); } };
  ruler.addEventListener("pointerup",end);
  ruler.addEventListener("pointercancel",end);
  layout();

  const timers=[];
  function toast(msg){
    const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
    box.appendChild(t); timers.push(setTimeout(()=>t.remove(),1600));
  }
  $("#countBtn").addEventListener("click",()=>{
    if(busy) return;
    audio();
    const by=(a,b)=>(+a.dataset.hx)-(+b.dataset.hx);
    const L=beans.filter(b=>+b.dataset.hx<rx).sort(by);
    const R=beans.filter(b=>+b.dataset.hx>=rx).sort(by);
    if(!L.length||!R.length){                        /* 還沒分成兩堆 */
      ruler.classList.add("wob"); setTimeout(()=>ruler.classList.remove("wob"),440);
      sfx.soft(); toast("兩邊都要有喔"); return;
    }
    busy=true; $("#countBtn").disabled=true;
    beans.forEach(b=>b.classList.add("dim"));
    const seq=[...L,...R]; let cl=0, cr=0;
    seq.forEach((b,i)=>timers.push(setTimeout(()=>{
      b.classList.add("lit");
      const k = i<L.length ? ++cl : ++cr;
      sfx.step(k); sayNum(k);
    }, i*420)));
    const t0=seq.length*420;
    timers.push(setTimeout(()=>{
      const note=document.createElement("div");
      note.className="tape-note";
      note.innerHTML=`<div class="l1">${n} = ${L.length} + ${R.length}</div>`+
        `<div class="l2">${L.length===R.length?"一樣多！":"分成兩堆了"}</div>`;
      box.appendChild(note);
      sfx.cheer(); say(zh(n)+"可以分成"+zh(L.length)+"和"+zh(R.length));
    }, t0+400));
    timers.push(setTimeout(nextRound, t0+2800));
  });
  return ()=>{ timers.forEach(clearTimeout); stage.style.flexDirection=""; };
}

/* ═══════════ 遊戲十二：畫線救狗狗 ═══════════
   畫一條線當屏障，擋住掉下來的蜜蜂，別讓牠們碰到狗狗。線的長度有限，要想清楚畫在哪。
   蜜蜂是會受重力、會彈跳的圓；畫出來的線、地面、障礙都是它撞得到的線段。 */
/* 蜜蜂會飛、會繞，所以屏障要「圍」起來：靠地形、靠物件、或自己畫個罩子。
   地形 10 種 × 物件 8 種＝80 種組合，每次開始隨機配，一輪之內不重複。 */
const TERRAINS=[
  {n:"平地",  t:[[0,.94],[1,.94]],                                         d:.50},
  {n:"左台階",t:[[0,.74],[.40,.74],[.46,.94],[1,.94]],                     d:.20},
  {n:"右台階",t:[[0,.94],[.54,.94],[.60,.74],[1,.74]],                     d:.80},
  {n:"高台",  t:[[0,.94],[.30,.94],[.36,.70],[.64,.70],[.70,.94],[1,.94]], d:.50},
  {n:"凹坑",  t:[[0,.82],[.32,.82],[.36,.97],[.64,.97],[.68,.82],[1,.82]], d:.50},
  {n:"斜坡",  t:[[0,.72],[1,.95]],                                         d:.74},
  {n:"山谷",  t:[[0,.72],[.50,.96],[1,.72]],                               d:.50},
  {n:"小丘",  t:[[0,.94],[.28,.94],[.50,.76],[.72,.94],[1,.94]],           d:.50},
  {n:"雙階",  t:[[0,.70],[.28,.70],[.34,.84],[.62,.84],[.68,.95],[1,.95]], d:.15},
  {n:"窄柱台",t:[[0,.94],[.40,.94],[.44,.70],[.56,.70],[.60,.94],[1,.94]], d:.50}
];
const OBJS=[
  {n:"空曠", b:[]},
  {n:"左柱", b:[[.16,.50,.055,.46]]},
  {n:"右柱", b:[[.79,.50,.055,.46]]},
  {n:"雙柱", b:[[.16,.50,.055,.46],[.79,.50,.055,.46]]},
  {n:"浮板", b:[[.30,.44,.40,.045]]},
  {n:"雙簷", b:[[0,.34,.30,.045],[.70,.34,.30,.045]]},
  {n:"石頭", b:[[.24,.82,.09,.09],[.68,.82,.09,.09]]},
  {n:"高柱", b:[[.47,.24,.06,.36]]}
];
let saveUsed=new Set();
function genSave(){
  let T,O,key,guard=0;
  do{
    T=TERRAINS[Math.random()*TERRAINS.length|0];
    O=OBJS[Math.random()*OBJS.length|0];
    key=T.n+"/"+O.n;
    /* 物件不能壓在狗身上 */
    var clash=O.b.some(b=>T.d>b[0]-.09 && T.d<b[0]+b[2]+.09 && b[1]+b[3]>.60);
  }while((saveUsed.has(key)||clash) && ++guard<80);
  saveUsed.add(key);
  const nb=4+(Math.random()*4|0), bees=[];            /* 4～7 隻，各難度相同 */
  for(let i=0;i<nb;i++) bees.push([.10+ (i+ .5)/nb*.80 + (Math.random()-.5)*.10, .05+Math.random()*.11]);
  return {terr:T.t, dogx:T.d, boxes:O.b, bees, ink:.50+Math.random()*.22, name:T.n+"＋"+O.n};
}
function buildSave(){
  const lv=genSave();
  stage.innerHTML=`<div class="savew"><canvas></canvas><div class="inkbar"><i></i></div></div>
    <div class="savebar"><button class="btn ghost" id="redraw">重畫</button>
      <span class="savetip">用手指畫一條線擋住蜜蜂</span></div>`;
  stage.style.flexDirection="column";
  const wrap=stage.querySelector(".savew"), cv=wrap.querySelector("canvas");
  const inkEl=wrap.querySelector(".inkbar"), inkFill=inkEl.querySelector("i");
  const W=wrap.clientWidth, H=wrap.clientHeight, dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);

  const U=Math.min(W,H);
  const RB=U*0.035, RD=U*0.075;                    /* 蜜蜂半徑、狗狗半徑 */
  /* 狗狗也是物理物體：會下落、會滾、會被防護罩推走。地形與物件是鎖死的，不動 */
  const DR=RD*0.72, MD=120;                        /* 狗的碰撞半徑與質量（比防護罩輕，推得動） */
  const terr=lv.terr.map(p=>[p[0]*W,p[1]*H]);
  const boxes=lv.boxes.map(b=>({x:b[0]*W,y:b[1]*H,w:b[2]*W,h:b[3]*H}));
  function groundYAt(x){
    let y=H;
    for(let i=1;i<terr.length;i++){
      const a=terr[i-1], b=terr[i];
      if(x>=Math.min(a[0],b[0]) && x<=Math.max(a[0],b[0])){
        const t=(x-a[0])/((b[0]-a[0])||1);
        y=Math.min(y, a[1]+(b[1]-a[1])*t);
      }
    }
    return y;
  }
  const DX=lv.dogx*W;
  const dog={x:DX, y:groundYAt(DX)-DR-2, vx:0, vy:0, ang:0};
  const inkMax=lv.ink*(W+H)/2;
  let ink=inkMax, stroke=[], drawing=false, pid=null;
  let bees=[], body=null, phase="draw", t0=0, raf2=null, frames=0;
  let spin=1;                                        /* 這一輪蜂群統一要把罩子往哪邊扳 */
  const SURV=10000;                                   /* 撐 10 秒就算保護成功（各難度相同） */
  const RS=Math.max(4,U*0.011);                       /* 防護罩線的半徑（碰撞用） */
  const tip=stage.querySelector(".savetip");

  /* 蜜蜂用的線段表：地形折線 + 物件四邊 + 左右邊界 */
  const beeSegs=(()=>{
    const s=[[[0,0],[0,H]],[[W,0],[W,H]]];
    for(let i=1;i<terr.length;i++) s.push([terr[i-1],terr[i]]);
    boxes.forEach(r=>s.push([[r.x,r.y],[r.x+r.w,r.y]],[[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]],
                            [[r.x,r.y],[r.x,r.y+r.h]],[[r.x+r.w,r.y],[r.x+r.w,r.y+r.h]]));
    return s;
  })();
  /* 一個圓點碰到所有不動的東西時，回報接觸點、法線、穿透量（isG＝踩到地形） */
  function eachStatic(px,py,r,cb){
    for(let i=1;i<terr.length;i++){
      const a=terr[i-1], b=terr[i];
      const dx=b[0]-a[0], dy=b[1]-a[1], L2=dx*dx+dy*dy||1;
      let t=((px-a[0])*dx+(py-a[1])*dy)/L2; t=Math.max(0,Math.min(1,t));
      const qx=a[0]+dx*t, qy=a[1]+dy*t;
      let nx=px-qx, ny=py-qy, d=Math.hypot(nx,ny);
      if(d<r){ if(d<.0001){nx=0;ny=-1;d=1;} cb(qx,qy,nx/d,ny/d,r-d,true); }
    }
    boxes.forEach(rc=>{
      const qx=Math.max(rc.x,Math.min(rc.x+rc.w,px)), qy=Math.max(rc.y,Math.min(rc.y+rc.h,py));
      let nx=px-qx, ny=py-qy, d=Math.hypot(nx,ny);
      if(d>=r) return;
      if(d<.0001){                                    /* 點在物件裡：往最薄的方向推出去 */
        const L=[px-rc.x, rc.x+rc.w-px, py-rc.y, rc.y+rc.h-py], k=L.indexOf(Math.min(...L));
        cb(px,py,[-1,1,0,0][k],[0,0,-1,1][k],r+L[k],false); return;
      }
      cb(qx,qy,nx/d,ny/d,r-d,false);
    });
    if(px<r)   cb(0,py,1,0,r-px,false);
    if(px>W-r) cb(W,py,-1,0,px-(W-r),false);
  }

  /* ── 防護罩成形＝變成一個剛體：有質心、有重量、有轉動慣量。
        直立的半圓重心偏高、著地點小，重力的力矩會讓它慢慢傾倒——
        這不是寫死的規則，是算出來的。 ── */
  function makeBody(pts){
    const rs=[pts[0]]; let acc=0;                     /* 重新取樣，物理點距約 14px */
    for(let i=1;i<pts.length;i++){
      acc+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
      if(acc>=14){ rs.push(pts[i]); acc=0; }
    }
    if(rs.length<2) rs.push([pts[pts.length-1][0]+2,pts[pts.length-1][1]]);
    let m=0,cx=0,cy=0;
    for(let i=1;i<rs.length;i++){                     /* 質心：線段長度加權 */
      const L=Math.hypot(rs[i][0]-rs[i-1][0],rs[i][1]-rs[i-1][1]);
      m+=L; cx+=L*(rs[i][0]+rs[i-1][0])/2; cy+=L*(rs[i][1]+rs[i-1][1])/2;
    }
    cx/=m; cy/=m;
    let I=0;
    for(let i=1;i<rs.length;i++){
      const mx=(rs[i][0]+rs[i-1][0])/2-cx, my=(rs[i][1]+rs[i-1][1])/2-cy;
      const L=Math.hypot(rs[i][0]-rs[i-1][0],rs[i][1]-rs[i-1][1]);
      I+=L*(mx*mx+my*my);
    }
    I=Math.max(I, m*RS*RS*6);
    /* 質量只影響「推不推得動」，不影響重力與傾倒；調輕一點讓蜂群撼動得了 */
    m*=0.55; I*=0.55;
    return {loc:rs.map(p=>[p[0]-cx,p[1]-cy]), x:cx, y:cy, th:0, vx:0, vy:0, om:0, m, I};
  }
  function worldPts(B){
    const c=Math.cos(B.th), s=Math.sin(B.th);
    return B.loc.map(p=>[B.x+p[0]*c-p[1]*s, B.y+p[0]*s+p[1]*c]);
  }
  /* 剛體接觸：位置推出＋衝量（含摩擦）。接觸點離質心越偏，轉動越多 → 會傾倒 */
  function contact(B,px,py,nx,ny,pen,e,mu){
    B.x+=nx*pen*.28; B.y+=ny*pen*.28;
    const rx=px-B.x, ry=py-B.y;
    const vpx=B.vx-B.om*ry, vpy=B.vy+B.om*rx;
    const vn=vpx*nx+vpy*ny;
    if(vn>=0) return;
    const rn=rx*ny-ry*nx, k=1/B.m+rn*rn/B.I;
    const j=-(1+e)*vn/k;
    B.vx+=j*nx/B.m; B.vy+=j*ny/B.m; B.om+=j*rn/B.I;
    const tx=-ny, ty=nx, vt=vpx*tx+vpy*ty, rt=rx*ty-ry*tx;
    const jt=Math.max(-mu*j,Math.min(mu*j, -vt/(1/B.m+rt*rt/B.I)));
    B.vx+=jt*tx/B.m; B.vy+=jt*ty/B.m; B.om+=jt*rt/B.I;
  }
  function bodyStep(B){
    B.vy+=U*0.00033;                                  /* 防護罩的重力 */
    B.vx*=.995; B.vy*=.998; B.om*=.985;
    B.x+=B.vx; B.y+=B.vy; B.th+=B.om;
    let grounded=false;
    for(let it=0;it<2;it++){
      worldPts(B).forEach(p=>{
        eachStatic(p[0],p[1],RS,(qx,qy,nx,ny,pen,isG)=>{
          if(isG) grounded=true;
          contact(B,qx,qy,nx,ny,pen,.05,.5);
        });
      });
    }
    if(grounded) B.vx*=.975;                           /* 貼地摩擦：推得動，但不會滑得像在冰上 */
  }

  /* 狗狗的物理：重力、落地、沿斜坡滾、被防護罩推 */
  function dogStep(){
    dog.vy+=U*0.00040; dog.vx*=.992;
    dog.x+=dog.vx; dog.y+=dog.vy;
    const hitD=(px,py,nx,ny,pen,mu)=>{
      dog.x+=nx*pen; dog.y+=ny*pen;
      const vn=dog.vx*nx+dog.vy*ny;
      if(vn<0){
        dog.vx-=1.12*vn*nx; dog.vy-=1.12*vn*ny;       /* 微彈：掉下來會彈一下 */
        const tx=-ny, ty=nx, vt=dog.vx*tx+dog.vy*ty;
        dog.vx-=vt*tx*mu; dog.vy-=vt*ty*mu;           /* 摩擦：斜面上會滾下去 */
      }
    };
    for(let it=0;it<3;it++){
      eachStatic(dog.x,dog.y,DR,(qx,qy,nx,ny,pen)=>hitD(qx,qy,nx,ny,pen,.10));
      /* 狗 vs 防護罩：兩個都有質量的真碰撞，力與反作用力都算進去 */
      if(body) worldPts(body).forEach((p,i,arr)=>{
        if(i===0) return;
        const a=arr[i-1], bx=p[0]-a[0], by=p[1]-a[1], L2=bx*bx+by*by||1;
        let t=((dog.x-a[0])*bx+(dog.y-a[1])*by)/L2; t=Math.max(0,Math.min(1,t));
        const px=a[0]+bx*t, py=a[1]+by*t;
        let nx=dog.x-px, ny=dog.y-py, d=Math.hypot(nx,ny);
        const r=DR+RS;
        if(d>=r) return;
        if(d<.0001){ nx=0; ny=-1; d=1; }
        nx/=d; ny/=d;
        const rx=px-body.x, ry=py-body.y;
        const spx=body.vx-body.om*ry, spy=body.vy+body.om*rx;   /* 罩子在接觸點的速度 */
        const rvx=dog.vx-spx, rvy=dog.vy-spy;
        const vn=rvx*nx+rvy*ny;
        if(vn<0){
          const rn=rx*ny-ry*nx, k=1/body.m+rn*rn/body.I+1/MD;
          const j=-1.05*vn/k;
          dog.vx+=j*nx/MD; dog.vy+=j*ny/MD;
          body.vx-=j*nx/body.m; body.vy-=j*ny/body.m; body.om-=j*rn/body.I;
          const tx=-ny, ty=nx, vt=rvx*tx+rvy*ty, rt=rx*ty-ry*tx;
          const jt=Math.max(-.45*j,Math.min(.45*j,-vt/k));
          dog.vx+=jt*tx/MD; dog.vy+=jt*ty/MD;
          body.vx-=jt*tx/body.m; body.vy-=jt*ty/body.m; body.om-=jt*rt/body.I;
        }
        dog.x+=nx*(r-d)*.62; dog.y+=ny*(r-d)*.62;               /* 位置分離：重的少讓一點 */
        body.x-=nx*(r-d)*.38; body.y-=ny*(r-d)*.38;
      });
    }
    dog.ang += dog.vx/DR;                              /* 滾動角＝位移/半徑，滾起來才對 */
  }

  function reset(){
    dog.x=DX; dog.y=groundYAt(DX)-DR-2; dog.vx=0; dog.vy=0; dog.ang=0;
    /* 分工：0 直接撲狗、1 找破口鑽、2 去頂槓桿最長的地方把罩子扳倒 */
    bees=lv.bees.map((b,i)=>({x:b[0]*W, y:b[1]*H, vx:0, vy:SPD, w:Math.random()*6.28,
      role:i%3, hold:0, side:Math.random()<.5?-1:1, blocked:0, stuck:0, tx:1, ty:0}));
    wrap._bees=bees; wrap._dog=dog; wrap._getBody=()=>body;
    phase="draw"; stroke=[]; body=null; ink=inkMax; frames=0;
    spin=Math.random()<.5?-1:1;
    inkEl.classList.remove("out"); inkFill.style.width="100%";
    tip.textContent="用手指畫一條線擋住蜜蜂";
    draw();
  }
  /* 圓 vs 線段：推出去，然後把速度投影到表面上 → 蜜蜂會「沿著障礙滑」，
     滑到盡頭就繞過去，所以牠會自己找空隙鑽。屏障沒圍起來是擋不住的。 */
  function hitSeg(b,seg,r){
    const [ax,ay]=seg[0],[bx,by]=seg[1];
    const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1;
    let t=((b.x-ax)*dx+(b.y-ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const px=ax+dx*t, py=ay+dy*t;
    let nx=b.x-px, ny=b.y-py, d=Math.hypot(nx,ny);
    if(d>=r) return false;
    if(d<.0001){ nx=0; ny=-1; d=1; }
    nx/=d; ny/=d;
    b.x=px+nx*r; b.y=py+ny*r;
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){
      b.vx-=vn*nx; b.vy-=vn*ny;                       /* 去掉撞進去的分量＝貼著滑 */
      /* 記住牆的方向，沿著牆走到盡頭；正面撞上時用自己偏好的那一邊 */
      let tx=-ny, ty=nx;
      const along=b.vx*tx+b.vy*ty;
      if(Math.abs(along)<SPD*0.25){ tx*=b.side; ty*=b.side; }
      else if(along<0){ tx=-tx; ty=-ty; }
      b.tx=tx; b.ty=ty; b.blocked=16;
    }
    lastHit={px,py,nx,ny};
    return true;
  }
  let lastHit=null;
  const SPD=U*0.0050;                                 /* 飛行速度 */
  const BPUSH=U*0.0230*(saveCfg.pct/100);             /* 蜜蜂推防護罩的力道（依難度縮放） */
  const RBc=RB*0.58;                                  /* 碰撞用的身體比看起來小：縫隙夠大就鑽得過去 */
  /* 罩子上離重心最遠的那一點＝槓桿最長的地方＝最容易被扳倒的弱點；
     兩端則是可以繞過去的破口。蜜蜂會分工去找這兩種弱點。 */
  function weakSpots(wp,B){
    /* 要扳倒一個站著的東西，該推的是「最高的地方」——對底部支點的力臂最長。
       推貼地的兩端只會被地面撐死，那是白費力氣。 */
    let tip=wp[0], best=1e9;
    wp.forEach(p=>{ if(p[1]<best){ best=p[1]; tip=p; } });
    return {tip, ends:[wp[0], wp[wp.length-1]]};
  }
  function step2(){
    if(body) bodyStep(body);                          /* 防護罩自己的重量與傾倒 */
    dogStep();                                        /* 狗狗也受重力、會滾、會被推 */
    const S=beeSegs;
    const BS=[]; let bwp=null, weak=null;
    if(body){
      bwp=worldPts(body);
      for(let i=1;i<bwp.length;i++) BS.push([bwp[i-1],bwp[i]]);
      weak=weakSpots(bwp,body);
    }
    /* 蜂群戰術：先分頭找弱點；3 秒還沒突破就全員集中攻同一個點。
       散開來推力會互相抵消，集中才推得倒——這是蜂群真正的威脅所在。 */
    frames++;
    if(body && frames>180) bees.forEach(b=>{ b.role=2; });
    let caught=false;
    bees.forEach(b=>{
      let dx=dog.x-b.x, dy=dog.y-b.y;
      const dd=Math.hypot(dx,dy)||1; dx/=dd; dy/=dd;   /* 朝狗狗的方向 */
      let gx,gy;
      if(b.blocked>0){                                /* 被擋住：沿著牆走，走到盡頭再轉向狗 */
        b.blocked--; b.stuck++;
        gx=b.tx; gy=b.ty;
        if(b.stuck>240){ b.side*=-1; b.stuck=0; b.blocked=0; }   /* 走太久是死路，換邊 */
      }else if(weak && dd>RD*2.2){                    /* 有罩子擋著：先去打弱點 */
        let t = b.role===2 ? weak.tip
              : b.role===1 ? (Math.hypot(weak.ends[0][0]-b.x,weak.ends[0][1]-b.y) <
                              Math.hypot(weak.ends[1][0]-b.x,weak.ends[1][1]-b.y) ? weak.ends[0] : weak.ends[1])
              : null;
        if(t){
          gx=t[0]-b.x; gy=t[1]-b.y; const l=Math.hypot(gx,gy)||1; gx/=l; gy/=l;
          /* 已經頂在弱點上還過不去，就放棄這個弱點、直接撲狗 */
          b.hold = l<RB*3 ? b.hold+1 : 0;
          if(b.hold>110){ b.role=0; b.hold=0; }
        } else { gx=dx; gy=dy; }
        b.stuck=0;
      }else{
        b.stuck=0; gx=dx; gy=dy;
      }
      let hx=b.vx, hy=b.vy; const hl=Math.hypot(hx,hy)||1; hx/=hl; hy/=hl;
      b.w+=0.16;
      const wob=Math.sin(b.w)*0.30;                   /* 蜜蜂的擺動 */
      hx += (gx-hx)*0.18 - gy*wob*0.08;
      hy += (gy-hy)*0.18 + gx*wob*0.08;
      const nl=Math.hypot(hx,hy)||1;
      b.vx=hx/nl*SPD; b.vy=hy/nl*SPD;
      b.x+=b.vx; b.y+=b.vy;
      let touch=null;
      for(let k=0;k<3;k++){
        S.forEach(s=>hitSeg(b,s,RBc));
        BS.forEach(s=>{ if(hitSeg(b,s,RBc+RS)) touch=lastHit; });
      }
      /* 貼到罩子上就持續施力。方向不是死命往狗狗壓——壓在圓罩正上方力矩是零，白費力；
         聰明的推法是帶一個「讓罩子翻過去」的切向分量，所以貼哪裡都撼動得了。 */
      if(touch && body){
        const rx=touch.px-body.x, ry=touch.py-body.y, rl=Math.hypot(rx,ry)||1;
        /* 整群往同一個方向扳：分開選方向會互相抵消，罩子反而紋風不動 */
        const tx=-ry/rl*spin, ty=rx/rl*spin;
        const ux=dx*0.35+tx*0.65, uy=dy*0.35+ty*0.65, ul=Math.hypot(ux,uy)||1;
        const fx=ux/ul*BPUSH, fy=uy/ul*BPUSH;
        body.vx+=fx/body.m; body.vy+=fy/body.m;
        body.om+=(rx*fy-ry*fx)/body.I;
      }
      if(Math.hypot(b.x-dog.x,b.y-dog.y)<RB+RD*0.62) caught=true;   /* 要真的碰到，隔著線不算 */
    });
    if(caught) return "lose";
    if(Date.now()-t0>SURV) return "win";              /* 撐過去就贏 */
    return null;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#EDF6F4"); sky.addColorStop(1,"#DCEDE8");
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#BFD9D2";                                         /* 地形 */
    ctx.beginPath(); ctx.moveTo(terr[0][0],terr[0][1]);
    terr.forEach(p=>ctx.lineTo(p[0],p[1]));
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#A9C9C0";                                         /* 物件 */
    boxes.forEach(r=>{ ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,8); ctx.fill(); });
    const line = body ? worldPts(body) : (stroke.length>1?stroke:null);
    if(line){                                                        /* 玩家畫的防護罩 */
      ctx.strokeStyle="#7B5EA7"; ctx.lineWidth=RS*2;
      ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.beginPath(); ctx.moveTo(line[0][0],line[0][1]);
      for(let i=1;i<line.length;i++) ctx.lineTo(line[i][0],line[i][1]);
      ctx.stroke();
    }
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.save(); ctx.translate(dog.x,dog.y); ctx.rotate(dog.ang);   /* 滾動看得出來 */
    ctx.font=(RD*2)+"px serif";
    ctx.fillText(phase==="lose"?"😰":"🐶", 0, 0);
    ctx.restore();
    ctx.font=(RB*2.1)+"px serif";
    bees.forEach(b=>ctx.fillText("🐝",b.x,b.y));
  }
  /* 用真實時間推進：不同平板的更新率不一樣，掉幀時也不會讓蜜蜂變慢 */
  let last=0;
  wrap._tick=n=>{ for(let i=0;i<n;i++){ const r=step2(); if(r) return r; } return null; };
  function loop(){
    const now=performance.now();
    const n=last ? Math.max(1,Math.min(4,Math.round((now-last)/16.67))) : 1;
    last=now;
    let r=null;
    for(let i=0;i<n && !r;i++) r=step2();
    draw();
    tip.textContent="撐住 "+Math.max(0,Math.ceil((SURV-(Date.now()-t0))/1000))+" 秒";
    if(r==="lose"){
      phase="lose"; draw(); sfx.fall(); say("被叮到了");
      wrap.classList.add("shake"); setTimeout(()=>wrap.classList.remove("shake"),440);
      setTimeout(()=>{ reset(); },1100);
      return;
    }
    if(r==="win"){
      phase="win"; draw(); sfx.cheer(); say("救到狗狗了");
      setTimeout(nextRound,1500);
      return;
    }
    raf2=requestAnimationFrame(loop);
  }

  const pt=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener("pointerdown",e=>{
    if(phase!=="draw"||pid!==null||ink<=2) return;
    audio(); pid=e.pointerId; drawing=true; stroke=[pt(e)]; ink=inkMax;
    inkEl.classList.remove("out"); inkFill.style.width="100%";
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  });
  cv.addEventListener("pointermove",e=>{
    if(!drawing||e.pointerId!==pid) return;
    const p=pt(e), last=stroke[stroke.length-1];
    const d=Math.hypot(p[0]-last[0],p[1]-last[1]);
    if(d<3) return;
    if(ink-d<=0){                                    /* 墨水用完，線就到此為止 */
      drawing=false; inkEl.classList.add("out"); inkFill.style.width="0%"; go(); return;
    }
    ink-=d; stroke.push(p);
    inkFill.style.width=Math.max(0,ink/inkMax*100)+"%";
    draw();
  });
  function go(){
    if(phase!=="draw") return;
    if(stroke.length<2){ stroke=[]; draw(); return; }
    body=makeBody(stroke); stroke=[];                 /* 成形：從這一刻起有重量、會倒、推得動 */
    phase="run"; t0=Date.now(); last=0;
    cancelAnimationFrame(raf2); raf2=requestAnimationFrame(loop);
  }
  const endDraw=e=>{ if(e.pointerId!==pid) return; pid=null; if(drawing){ drawing=false; go(); } };
  cv.addEventListener("pointerup",endDraw);
  cv.addEventListener("pointercancel",endDraw);
  $("#redraw").addEventListener("click",()=>{ audio(); sfx.tap(); cancelAnimationFrame(raf2); reset(); });

  reset();
  return ()=>{ cancelAnimationFrame(raf2); stage.style.flexDirection=""; };
}

/* ═══════════ 遊戲十：兩人對戰分樹果 ═══════════ */
function buildDuel(){
  stage.innerHTML=`<div class="duelw"><div class="mid"></div></div>`;
  const box=stage.querySelector(".duelw");
  const W=box.clientWidth, H=box.clientHeight, HW=W/2;
  const zones={}, timers=[];
  let over=false;

  ["L","R"].forEach((z,zi)=>{
    const x0=zi*HW, n=duelCfg[z];
    const nr=Math.max(1,Math.min(n-1,Math.round(n*(0.35+Math.random()*0.3))));
    const kinds=shuffle(Array.from({length:n},(_,i)=>i<nr?"r":"g"));
    const S=Math.max(15,Math.min(40, Math.min(HW,H)*0.085*Math.sqrt(10/n)));
    const bowl={x:x0+HW*.10,y:H*.03,w:HW*.80,h:H*.40};
    const pw=Math.min(HW*.42,H*.36), ph=Math.min(H*.34,pw*.82);
    const pl={r:{x:x0+HW*.05,y:H-ph-H*.04,w:pw,h:ph}, g:{x:x0+HW*.95-pw,y:H-ph-H*.04,w:pw,h:ph}};
    const bw=document.createElement("div");
    bw.className="bowl";
    Object.assign(bw.style,{left:bowl.x+"px",top:bowl.y+"px",width:bowl.w+"px",height:bowl.h+"px"});
    box.appendChild(bw);
    ["r","g"].forEach(t=>{
      const p=document.createElement("div");
      p.className="plate"; p.dataset.t=t; p.dataset.z=z;
      p.innerHTML=`<span class="tag">${t==="r"?"火 🔥":"草 🌿"}</span>`;
      Object.assign(p.style,{left:pl[t].x+"px",top:pl[t].y+"px",width:pl[t].w+"px",height:pl[t].h+"px"});
      box.appendChild(p);
    });
    kinds.forEach((t,i)=>{
      const bx=bowl.x+S+Math.random()*(bowl.w-S*2);
      const by=bowl.y+S+Math.random()*(bowl.h-S*2.2);
      const b=document.createElement("div");
      b.className="bean"; b.dataset.t=t; b.dataset.z=z; b.dataset.in="";
      b.style.cssText=`left:${bx}px;top:${by}px;width:${S}px;height:${S*.82}px;--r:${(Math.random()*60-30)|0}deg`;
      box.appendChild(b);
    });
    zones[z]={pl,n,S};
  });

  let zz=10;
  dragify(box,".bean",(el,x,y,back)=>{
    if(over) { back(); return; }
    const z=el.dataset.z, t=el.dataset.t, P=zones[z].pl;
    const hit = inRect(x,y,P.r)?"r" : inRect(x,y,P.g)?"g" : null;
    el.style.zIndex=++zz;
    if(hit && hit!==t){ back(); el.classList.add("wob"); setTimeout(()=>el.classList.remove("wob"),440); sfx.soft(); return; }
    if(hit===t){
      const p=P[t], cx=p.x+p.w/2, cy=p.y+p.h/2;
      const rx=p.w/2-zones[z].S*.6, ry=p.h/2-zones[z].S*.5;
      let dx=(x-cx)/rx, dy=(y-cy)/ry, d=Math.hypot(dx,dy);
      if(d>.86){ const k=.86/d; x=cx+dx*rx*k; y=cy+dy*ry*k; }
      el.style.left=x+"px"; el.style.top=y+"px"; el.dataset.in=t; sfx.yes();
      const rest=[...box.querySelectorAll('.bean[data-z="'+z+'"]')].filter(b=>b.dataset.in!==b.dataset.t).length;
      if(rest===0) win(z);
    }else{
      const lo=z==="L"?0:HW, hi=z==="L"?HW:W;      /* 只能待在自己那半邊 */
      el.style.left=Math.max(lo+zones[z].S,Math.min(hi-zones[z].S,x))+"px";
      el.style.top =Math.max(zones[z].S,Math.min(H-zones[z].S,y))+"px";
      el.dataset.in="";
    }
  },true);                                          /* ← 兩個人可以同時拖 */

  function win(z){
    over=true;
    box.querySelectorAll(".bean").forEach(b=>b.classList.add("set"));
    const w=document.createElement("div");
    w.className="winner";
    w.innerHTML=`<div class="w1">${z==="L"?"⬅️":"➡️"}</div><div class="w2">${z==="L"?"左邊":"右邊"}贏了！</div>`;
    box.appendChild(w);
    sfx.cheer(); say(z==="L"?"左邊贏了":"右邊贏了");
    timers.push(setTimeout(()=>finish((z==="L"?"左邊":"右邊")+"贏了！","再比一次？"),2000));
  }
  return ()=>timers.forEach(clearTimeout);
}

/* ═══════════ 流程 ═══════════ */
function build(){
  if(cleanup){ cleanup(); cleanup=null; }
  askEl.textContent=GAMES[game].ask;
  startClock(game==="sortL"?clockCarry:0);        /* 每一輪接著上一輪剩下的時間跑 */
  if(game==="match"||game==="link"||game==="shadow") cleanup=buildPairs();
  else if(game==="memS"||game==="memL") cleanup=buildMem();
  else if(game==="scale") cleanup=buildScale();
  else if(game==="ten") cleanup=buildTen();
  else if(game==="duel") cleanup=buildDuel();
  else if(game==="ruler") cleanup=buildRuler();
  else if(game==="save") cleanup=buildSave();
  else if(game==="dotsS"||game==="dotsL") cleanup=buildDots();
  else if(game==="tally") cleanup=buildTally();
  else if(game==="sortS"||game==="sortL") cleanup=buildSort();
  else if(game==="stackS"||game==="stackL") cleanup=buildStack();
  else cleanup=buildPlus();

  /* 挑豆子與疊高高是用「建立當下的像素」排版的，平板轉向後會整個走位，
     所以尺寸一變就重排這一題（星星進度保留，只有這一題重來）。 */
  if(/^(sortS|sortL|stackS|stackL|duel|ruler|save)$/.test(game)){
    const w0=stage.clientWidth, h0=stage.clientHeight, inner=cleanup;
    let t=null;
    const onResize=()=>{
      clearTimeout(t);
      t=setTimeout(()=>{
        if(Math.abs(stage.clientWidth-w0)>24 || Math.abs(stage.clientHeight-h0)>24){
          if(game==="sortL"&&sortCfg.sec) clockCarry=clockLeft();   /* 轉向重排不吃掉剩餘時間 */
          build();
        }
      },280);
    };
    window.addEventListener("resize",onResize);
    cleanup=()=>{ clearTimeout(t); window.removeEventListener("resize",onResize); if(inner) inner(); };
  }
}
const setup=$("#setup");
const N_OPTS=[10,30,50], T_OPTS=[[0,"不限"],[120,"120″"],[60,"60″"],[30,"30″"]];
const D_OPTS=[6,10,14];
const S_OPTS=[[50,"50% 弱"],[70,"70% 中"],[100,"100% 強"]];   /* 只改蜜蜂力量 */
let setupKind="sort";
function renderSetup(){
  const duel=setupKind==="duel", sv=setupKind==="save";
  const rows=setup.querySelectorAll(".optrow");
  $("#setupTitle").textContent = sv?"畫線救狗狗":(duel?"兩人對戰":"分樹果");
  rows[1].classList.toggle("hidden", sv);          /* 難度只有一排選項 */

  $("#optN").innerHTML = sv
    ? S_OPTS.map(([v,t])=>`<button class="chip${v===saveCfg.pct?" on":""}" data-n="${v}">${t}</button>`).join("")
    : duel
    ? D_OPTS.map(v=>`<button class="chip${v===duelCfg.L?" on":""}" data-n="${v}">${v}</button>`).join("")
    : N_OPTS.map(v=>`<button class="chip${v===sortCfg.n?" on":""}" data-n="${v}">${v}</button>`).join("");
  if(!sv) $("#optT").innerHTML = duel
    ? D_OPTS.map(v=>`<button class="chip${v===duelCfg.R?" on":""}" data-t="${v}">${v}</button>`).join("")
    : T_OPTS.map(([v,t])=>`<button class="chip${v===sortCfg.sec?" on":""}" data-t="${v}">${t}</button>`).join("");
}
function showSetup(kind){
  setupKind=kind||"sort";
  if(cleanup){ cleanup(); cleanup=null; }
  stopClock(); stage.innerHTML="";
  home.classList.add("hidden"); menu.classList.add("hidden");
  play.classList.add("hidden"); done.classList.add("hidden");
  setup.classList.remove("hidden");
  renderSetup();
}

function startGame(id){
  game=id; step=0; maxNum=5; sumMax=6; miss=0; shapeQueue=[];
  qpool=buildPool(id); saveUsed=new Set();         /* 每次開始重抽題目與地形組合 */
  /* 顆數越多，一輪就夠久了，不要再重複三輪 */
  if(id==="sortL") GAMES.sortL.rounds = sortCfg.n<=10?3:(sortCfg.n<=30?2:1);

function goHome(){
  if(cleanup){ cleanup(); cleanup=null; }
  stopClock(); stage.innerHTML=""; cancelAnimationFrame(raf);
  menu.classList.add("hidden"); play.classList.add("hidden");
  setup.classList.add("hidden"); done.classList.add("hidden");

function finish(title,sub){
  if(cleanup){ cleanup(); cleanup=null; }
  stopClock(); onTimeUp=null; clockEl.classList.add("hidden");
  const book=loadBook(), unused=STICKERS.filter(s=>!book.includes(s));
  const got = unused.length ? one(unused) : one(STICKERS);
  if(!book.includes(got)){ book.push(got); saveBook(book); }
  $("#doneSticker").textContent=got;
  $("#doneTitle").textContent=title||"全部完成了！";
  $("#doneSub").textContent=sub||"收進收集簿了";
  done.classList.remove("hidden");
  sfx.cheer(); say("好棒");
  confetti(); renderBook();
}

/* ═══════════ 煙火 ═══════════ */
const cv=$("#confetti"); let raf=null;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx=cv.getContext("2d"), dpr=Math.min(2,devicePixelRatio||1);
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#E8556D","#FFC43D","#3FA796","#7B5EA7","#FFFFFF"];
  const ps=Array.from({length:110},()=>({
    x:W/2+(Math.random()-.5)*W*.5, y:H*.42+(Math.random()-.5)*40,
    vx:(Math.random()-.5)*9, vy:-Math.random()*11-3,
    s:5+Math.random()*7, a:Math.random()*6.28, va:(Math.random()-.5)*.3,
    c:cols[Math.random()*cols.length|0]
  }));
  let t=0; cancelAnimationFrame(raf);
  (function loop(){
    t++; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{
      p.vy+=.26; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); ctx.restore();
    });
    if(t<200) raf=requestAnimationFrame(loop); else ctx.clearRect(0,0,W,H);
  })();
}

$("#toMenu").addEventListener("click",()=>showMenu(mode));
$("#again").addEventListener("click",()=>{ done.classList.add("hidden"); cancelAnimationFrame(raf); startGame(game); });
$("#optN").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  if(setupKind==="save") saveCfg.pct=+c.dataset.n;
  else if(setupKind==="duel") duelCfg.L=+c.dataset.n;
  else sortCfg.n=+c.dataset.n;
  storeCfg(); renderSetup(); sfx.tap(); });
$("#optT").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  if(setupKind==="duel") duelCfg.R=+c.dataset.t; else sortCfg.sec=+c.dataset.t;
  storeCfg(); renderSetup(); sfx.tap(); });
$("#setupGo").addEventListener("click",()=>{ audio(); sfx.tap();
  startGame(setupKind==="duel"?"duel":setupKind==="save"?"save":"sortL"); });
$("#setupBack").addEventListener("click",()=>showMenu(mode));

document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());

renderBook();
})();
</script>

<script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
