<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小車手與小訓練家</title>
<!-- PWA：加到 iPad 主畫面後可全螢幕、可離線 -->
<link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="數學遊戲"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#3FA796">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 單一視覺世界：幼兒剪貼簿（淺色紙張）。刻意不做深色主題——
   幼兒遊戲在深色底下會失去「紙」的質感，所有顏色一律明確指定。 */
:root{
  --ground:#E7F1EE;
  --ground-dot:#CFE3DE;
  --paper:#FFFFFF;
  --paper-warm:#FFFBF4;
  --ink:#2C3A38;
  --ink-soft:#6A7B78;
  --berry:#E8556D;
  --sun:#FFC43D;
  --leaf:#3FA796;
  --grape:#7B5EA7;
  --line:#CADDD8;
  --shadow:0 6px 0 rgba(44,58,56,.10), 0 14px 28px rgba(44,58,56,.10);
  --blob:20px 26px 18px 24px / 24px 18px 26px 20px;
  --font-zh:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
  --font-num:"Baloo 2","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at 1px 1px, var(--ground-dot) 1.6px, transparent 1.7px) 0 0/26px 26px,
    var(--ground);
  color:var(--ink);
  font-family:var(--font-zh);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
}
#app{min-height:100svh;display:flex;flex-direction:column}
.hidden{display:none!important}
section{flex:1;display:flex;flex-direction:column}

.tape{
  display:inline-block;padding:.35em 1.1em;
  background:var(--sun);color:var(--ink);
  transform:rotate(-1.6deg);
  box-shadow:0 3px 0 rgba(44,58,56,.12);
  font-weight:900;letter-spacing:.06em;
}

/* ── 首頁 / 選單 ──────────────────────────── */
.center{align-items:center;justify-content:center;gap:clamp(16px,3.2vmin,32px);padding:clamp(16px,3.6vmin,36px) 20px}
h1{margin:0;font-size:clamp(26px,5.2vmin,46px)}
.pick{display:flex;gap:clamp(14px,3.2vmin,36px);flex-wrap:wrap;justify-content:center}
.who{
  all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3em;
  width:clamp(170px,31vmin,300px);padding:clamp(18px,3.6vmin,34px) clamp(12px,2vmin,20px);
  background:var(--paper);border-radius:var(--blob);box-shadow:var(--shadow);
  transition:transform .16s ease;
}
.who:nth-of-type(1){transform:rotate(-2deg)}
.who:nth-of-type(2){transform:rotate(1.8deg)}
.who:active{transform:scale(.96) rotate(0deg)}
.who:focus-visible{outline:4px solid var(--grape);outline-offset:4px}
.who .face{font-size:clamp(60px,13vmin,124px);line-height:1}
.who .name{font-weight:900;font-size:clamp(19px,3.3vmin,28px)}
.who .sub{font-size:clamp(13px,2vmin,16px);color:var(--ink-soft);font-weight:500}
.who[data-mode="bear"] .name{color:var(--berry)}
.who[data-mode="rabbit"] .name{color:var(--grape)}

.games{display:flex;gap:clamp(12px,2.6vmin,28px);flex-wrap:wrap;justify-content:center}
.gm{
  all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.25em;
  width:clamp(132px,23vmin,210px);padding:clamp(16px,3vmin,28px) clamp(10px,1.8vmin,18px);
  background:var(--paper);border-radius:var(--blob);box-shadow:var(--shadow);
  transition:transform .16s ease;
}
.gm:nth-of-type(odd){transform:rotate(-1.4deg)}
.gm:nth-of-type(even){transform:rotate(1.5deg)}
.gm:active{transform:scale(.95) rotate(0)}
.gm:focus-visible{outline:4px solid var(--grape);outline-offset:4px}
.gm .ic{font-size:clamp(40px,8vmin,76px);line-height:1}
.gm .nm{font-weight:900;font-size:clamp(16px,2.7vmin,23px)}
.gm .hint{font-size:clamp(11px,1.8vmin,14px);color:var(--ink-soft);font-weight:500}

#book{display:flex;flex-direction:column;align-items:center;gap:.5em;max-width:min(92vw,560px)}
#book .cap{font-size:clamp(12px,1.9vmin,15px);letter-spacing:.14em;color:var(--ink-soft);font-weight:700}
#bookRow{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  min-height:3.2em;padding:.7em 1em;background:var(--paper-warm);
  border-radius:18px;box-shadow:inset 0 0 0 2px var(--line);
}
#bookRow .st{font-size:clamp(24px,4vmin,34px);line-height:1}
#bookRow .empty{font-size:clamp(12px,1.9vmin,15px);color:var(--ink-soft);font-weight:500}

/* ── 遊戲列 ───────────────────────────────── */
#bar{
  flex:none;display:flex;align-items:center;gap:clamp(10px,2vmin,20px);
  padding:clamp(8px,1.6vmin,16px) clamp(12px,2.4vmin,24px);
}
.round-btn{
  all:unset;cursor:pointer;flex:none;
  width:clamp(46px,7.4vmin,62px);height:clamp(46px,7.4vmin,62px);
  display:grid;place-items:center;background:var(--paper);
  border-radius:50%;box-shadow:var(--shadow);
}
.round-btn:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.round-btn svg{width:45%;height:45%;fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
#ask{flex:1;text-align:center;font-weight:900;font-size:clamp(16px,3vmin,28px)}
#clock{
  flex:none;font-family:var(--font-num);font-weight:800;font-variant-numeric:tabular-nums;
  font-size:clamp(22px,4.4vmin,40px);color:var(--leaf);min-width:2.6em;text-align:right;
}
#clock.hot{color:var(--berry);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* 開始前的設定 */
.opts{display:flex;flex-direction:column;gap:clamp(10px,2vmin,20px)}
.optrow{display:flex;align-items:center;gap:clamp(10px,2vmin,20px);flex-wrap:wrap;justify-content:center}
.olbl{font-weight:900;font-size:clamp(15px,2.6vmin,22px);color:var(--ink-soft);min-width:3.2em}
.chips{display:flex;gap:clamp(8px,1.6vmin,14px);flex-wrap:wrap}
.chip{
  all:unset;cursor:pointer;padding:.5em 1.15em;border-radius:999px;
  background:var(--paper);box-shadow:inset 0 0 0 3px var(--line);
  font-family:var(--font-num);font-weight:800;font-size:clamp(18px,3.2vmin,28px);
}
.chip.on{background:var(--grape);color:#fff;box-shadow:0 4px 0 #5E4483}
.chip:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.row2{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#stars{display:flex;align-items:center;gap:clamp(4px,.9vmin,8px);flex:none}
#stars .prog{display:block;width:clamp(70px,14vmin,150px);height:clamp(9px,1.6vmin,14px);
  border-radius:99px;background:var(--line);overflow:hidden}
#stars .prog i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s ease}
#stars .pnum{font-family:var(--font-num);font-weight:800;font-variant-numeric:tabular-nums;
  font-size:clamp(13px,2.3vmin,20px);color:var(--ink-soft)}
#stars svg{width:clamp(22px,4vmin,36px);height:clamp(22px,4vmin,36px)}
#stars .s-off{fill:var(--line)}
#stars .s-on{fill:var(--sun)}

#stage{position:relative;flex:1;display:flex;padding:0 clamp(10px,2.4vmin,40px) clamp(12px,2.6vmin,32px);
  touch-action:none;user-select:none;-webkit-user-select:none;min-height:0;overflow:hidden}
#play{overflow:hidden;max-height:100svh}

/* ── 連連看（找一樣 / 數量配數字） ────────── */
.pairs{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3vmin,56px);min-height:0}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke-linecap:round}
.col{display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(8px,1.6vmin,18px);position:relative;z-index:1;min-height:0}
.card{
  position:relative;cursor:pointer;flex:1;
  min-height:clamp(56px,12vmin,132px);
  display:flex;align-items:center;justify-content:center;
  background:var(--paper);border-radius:var(--blob);box-shadow:var(--shadow);
  transition:transform .14s ease, box-shadow .14s ease;
}
.card.pick{box-shadow:0 0 0 5px var(--grape), var(--shadow);transform:scale(1.04)}
.card.done{background:var(--paper-warm);box-shadow:inset 0 0 0 3px var(--line);opacity:.62;cursor:default}
.card.nudge{animation:nudge .42s ease}
.card.hit{animation:pop .34s ease}
.card .art{font-size:clamp(42px,10vmin,96px);line-height:1}
.card .num{font-family:var(--font-num);font-weight:800;font-size:clamp(36px,9vmin,96px);line-height:1;color:var(--grape)}
.card .pips{display:grid;gap:clamp(2px,.7vmin,7px);padding:clamp(6px,1.4vmin,14px)}
.card .pips span{font-size:clamp(16px,4vmin,40px);line-height:1}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}

/* ── 點點畫 ───────────────────────────────── */
/* svg 絕對定位：正方形 viewBox 若參與 flex 版面，會用寬度撐出等高而把畫面擠爆 */
.dots{position:relative;flex:1;min-height:0}
.dots svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.dots .fill{fill:var(--sun);opacity:0;transition:opacity .7s ease}
.dots .fill.on{opacity:.5}
.dots .link{fill:none;stroke:var(--berry);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.dots .peg{fill:var(--paper);stroke:var(--line);stroke-width:5}
.dots .peg.on{fill:var(--berry);stroke:var(--berry)}
.dots .lbl{font-family:var(--font-num);font-weight:800;font-size:38px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dots .lbl.on{fill:#fff}
.dots .halo{fill:none;stroke:var(--grape);stroke-width:6;opacity:0}
.dots .halo.on{opacity:1;animation:ping 1.25s ease-out infinite}
/* 場景與完成後的畫面 */
.dots .scene{opacity:.45;transition:opacity .8s ease}
.dots.done .scene{opacity:1}
.dots .sun{fill:#FFD75E}
.dots .cloud{fill:#fff;opacity:.9}
.dots .hill{fill:#A7D397}
.dots .bub{fill:#fff;opacity:.55}
.dots .weed{fill:none;stroke:#5FAE7C;stroke-width:16;stroke-linecap:round}
.dots .lane{stroke:#fff;stroke-width:8;stroke-dasharray:60 50}
.dots .link.done{stroke:#2C3A38;stroke-width:14}
.dots.done .fill.on{opacity:.92}
.dots.done .pegs{opacity:0;transition:opacity .6s ease}
.dots .eyeW{fill:#fff;stroke:#2C3A38;stroke-width:6}
.dots .eyeB{fill:#2C3A38}
.dots .eyeS{fill:#fff}
.dots .mouth{fill:none;stroke:#2C3A38;stroke-width:8;stroke-linecap:round}
.dots .wheel{fill:#2C3A38}
.dots .hub{fill:#CFD8DC}
.dots .win{fill:#DFF3FF;stroke:#2C3A38;stroke-width:6;opacity:.9}
/* 著色：連完之後用手指塗色 */
.dots .paint path{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.palette{
  position:absolute;left:50%;bottom:clamp(8px,1.6vmin,16px);transform:translateX(-50%);
  display:flex;align-items:center;gap:clamp(6px,1.4vmin,12px);padding:clamp(6px,1.2vmin,10px) clamp(10px,1.8vmin,16px);
  background:var(--paper);border-radius:999px;box-shadow:var(--shadow);z-index:5;max-width:96%;flex-wrap:wrap;justify-content:center;
}
.palette .sw{width:clamp(34px,6vmin,52px);height:clamp(34px,6vmin,52px);border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.palette .sw.on{box-shadow:0 0 0 4px var(--grape)}
.palette .btn{font-size:clamp(14px,2.4vmin,20px);padding:.45em 1.1em}
@keyframes ping{0%{r:30;opacity:.95}100%{r:62;opacity:0}}
#reveal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-2deg);
  background:var(--paper);border-radius:var(--blob);box-shadow:var(--shadow);
  padding:clamp(16px,3vmin,30px) clamp(24px,4.4vmin,48px);text-align:center;pointer-events:none;
}
#reveal .em{font-size:clamp(48px,11vmin,110px);line-height:1}
#reveal .tx{font-weight:900;font-size:clamp(20px,4vmin,34px);margin-top:.2em}

/* ── 點點數 ───────────────────────────────── */
.field{position:relative;flex:1;min-height:0}
.critter{
  position:absolute;transform:translate(-50%,-50%);cursor:pointer;
  font-size:clamp(58px,13vmin,128px);line-height:1;
  filter:drop-shadow(0 5px 0 rgba(44,58,56,.14));
  transition:opacity .2s ease;
}
.critter.got{opacity:.34}
.critter.jump{animation:pop .38s ease}
.tally{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:var(--font-num);font-weight:800;color:var(--leaf);
  font-size:clamp(80px,22vmin,230px);line-height:1;opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.tally.on{opacity:.92}

/* ── 加法盤 ───────────────────────────────── */
.add{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vmin,26px);min-height:0}
.trays{display:flex;align-items:center;gap:clamp(8px,2vmin,26px)}
.tray{
  display:grid;gap:clamp(4px,1vmin,10px);align-content:center;justify-content:center;
  padding:clamp(10px,2.2vmin,24px);min-width:clamp(96px,20vmin,210px);min-height:clamp(96px,20vmin,210px);
  background:var(--paper);border-radius:var(--blob);box-shadow:var(--shadow);
}
.tray span{font-size:clamp(22px,4.6vmin,46px);line-height:1;opacity:.34;transition:opacity .15s ease,transform .15s ease}
.tray span.lit{opacity:1;transform:scale(1.16)}
.plus{font-family:var(--font-num);font-weight:800;font-size:clamp(30px,6.4vmin,64px);color:var(--ink-soft)}
.ans{display:flex;gap:clamp(10px,2.2vmin,24px)}
.ansc{
  all:unset;cursor:pointer;display:grid;place-items:center;
  width:clamp(74px,13vmin,124px);height:clamp(74px,13vmin,124px);
  background:var(--paper);border-radius:var(--blob);box-shadow:var(--shadow);
  font-family:var(--font-num);font-weight:800;font-size:clamp(34px,7vmin,68px);color:var(--grape);
}
.ansc:focus-visible{outline:4px solid var(--grape);outline-offset:4px}
.ansc.nudge{animation:nudge .42s ease}
.ansc.hit{animation:pop .34s ease;background:var(--sun)}

/* ── 挑豆子 ───────────────────────────────── */
.sortw{position:relative;flex:1;min-height:0}
.bowl{
  position:absolute;background:var(--paper-warm);
  border-radius:46% 46% 44% 44% / 30% 30% 58% 58%;
  box-shadow:var(--shadow), inset 0 0 0 3px var(--line);
}
.plate{
  position:absolute;background:var(--paper);border-radius:50% / 40%;
  box-shadow:var(--shadow);
}
.plate[data-t="r"]{box-shadow:var(--shadow), inset 0 0 0 6px #D4675C}
.plate[data-t="g"]{box-shadow:var(--shadow), inset 0 0 0 6px #93C35A}
.plate .tag{
  position:absolute;left:0;right:0;bottom:6%;text-align:center;
  font-weight:700;font-size:clamp(11px,1.9vmin,16px);color:var(--ink-soft);
}
.bean{
  position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--sc,1));
  border-radius:50%;touch-action:none;cursor:pointer;
  box-shadow:0 2px 3px rgba(44,58,56,.26);
  transition:left .22s ease, top .22s ease, transform .18s ease, opacity .2s ease;
}
.bean[data-t="r"]{background:radial-gradient(circle at 34% 30%, #DE7B6E, #A32B25 72%)}
.bean[data-t="g"]{background:radial-gradient(circle at 34% 30%, #A9D46B, #4F7C22 72%)}
/* 2 歲版：豆子改成小車，車頂與輪子用 CSS 畫，形狀才看得出是車 */
.sortw.cars .bowl{border-radius:26px}
.sortw.cars .plate[data-t="g"]{box-shadow:var(--shadow), inset 0 0 0 6px #4E86C8}
.bean.car{border-radius:42% 42% 26% 26% / 58% 58% 42% 42%}
.bean.car[data-t="g"]{background:radial-gradient(circle at 34% 30%, #7FB3E8, #2E5D96 72%)}
.bean.car::before{
  content:"";position:absolute;left:26%;top:-30%;width:46%;height:48%;
  border-radius:46% 46% 0 0;background:inherit;
}
.bean.car::after{
  content:"";position:absolute;left:14%;bottom:-14%;width:24%;height:40%;
  border-radius:50%;background:#2C3A38;box-shadow:var(--wd,20px) 0 0 #2C3A38;
}
.bean.grab{transition:none;z-index:60;--sc:1.18;filter:drop-shadow(0 7px 6px rgba(44,58,56,.28))}
.bean.set{cursor:default}
.bean.dim{opacity:.34}
.bean.lit{opacity:1;--sc:1.3}
.bean.wob{animation:nudge .42s ease}
.tape-note{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1.5deg);
  background:var(--paper);border-radius:var(--blob);box-shadow:var(--shadow);
  padding:clamp(14px,2.6vmin,26px) clamp(20px,4vmin,42px);text-align:center;pointer-events:none;z-index:70;
}
.tape-note .l1{font-family:var(--font-num);font-weight:800;font-size:clamp(24px,5vmin,48px)}
.tape-note .l2{font-weight:900;font-size:clamp(16px,3vmin,26px);margin-top:.2em;color:var(--berry)}
.tape-note .l3{font-weight:700;font-size:clamp(13px,2.2vmin,19px);margin-top:.35em;color:var(--leaf)}

/* ── 疊高高 ───────────────────────────────── */
.stackw{position:relative;flex:1;min-height:0}
.ground{position:absolute;height:10px;border-radius:5px;background:var(--line)}
.blk{
  position:absolute;border-radius:12px;touch-action:none;cursor:pointer;
  transform:translate(-50%,-50%) scale(var(--sc,1));
  transition:left .26s cubic-bezier(.2,.8,.2,1), top .26s cubic-bezier(.2,.8,.2,1), transform .18s ease;
  box-shadow:0 4px 0 rgba(44,58,56,.16);
}
.blk.grab{transition:none;z-index:60;--sc:1;filter:drop-shadow(0 8px 8px rgba(44,58,56,.26))}
.blk.set{pointer-events:none}
/* 2 歲版的積木＝貨櫃車，加兩顆輪子 */
.blk.box::after{
  content:"";position:absolute;left:12%;bottom:-6px;width:14%;height:12px;
  border-radius:50%;background:#2C3A38;box-shadow:var(--wd,60px) 0 0 #2C3A38;
}
/* 玩具版：看得到底面有多寬（實線）、上面能放東西的範圍有多大（虛線） */
.blk.toy{background:transparent;box-shadow:none;display:grid;place-items:center;overflow:visible}
.blk.toy .em{line-height:1;pointer-events:none}
.blk.toy .foot,.blk.toy .cap{
  position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;
}
.blk.toy .foot{bottom:-3px;height:5px;border-radius:3px;background:rgba(44,58,56,.30)}
.blk.toy .cap{top:-2px;height:0;border-top:3px dotted rgba(44,58,56,.26)}
.compin{position:absolute;transform:translateX(-50%);pointer-events:none;z-index:80;text-align:center}
.compin .bar{height:44px;border-left:3px dashed var(--berry);opacity:.75;margin:0 auto;width:0}
.compin .dot{width:16px;height:16px;border-radius:50%;background:var(--berry);margin:0 auto;
  box-shadow:0 0 0 5px rgba(232,85,109,.22)}
.compin .lb{font-weight:900;font-size:13px;color:var(--berry);margin-top:3px}
.blk.wob{animation:nudge .42s ease}
.blk.shake{animation:shake .5s ease}
@keyframes shake{
  0%,100%{transform:translate(-50%,-50%) scale(var(--sc,1)) rotate(0)}
  20%{transform:translate(-53%,-50%) scale(var(--sc,1)) rotate(-2deg)}
  55%{transform:translate(-47%,-50%) scale(var(--sc,1)) rotate(2deg)}
  80%{transform:translate(-51%,-50%) scale(var(--sc,1)) rotate(-1deg)}
}
.blk.fall{
  transition:transform .66s cubic-bezier(.36,0,.9,.45), opacity .4s .34s;

/* ═══════════ 聲音 ═══════════ */
let ac=null;
function audio(){
  if(ac===null){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=false; } }
  if(ac && ac.state==="suspended") ac.resume();
  return ac||null;
}
function tone(f,at,dur,vol,type){
  const c=audio(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+at;
  o.type=type||"sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx={
  tap(){ tone(660,0,.09,.10,"triangle"); },
  step(i){ tone(392*Math.pow(2,(i%8)/12),0,.12,.09,"triangle"); },
  yes(){ [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.085,.26,.13)); },
  soft(){ tone(300,0,.13,.06); tone(240,.1,.16,.05); },   /* 不是「錯了」，只是回彈 */
  fall(){ [300,240,190,150].forEach((f,i)=>tone(f,i*.09,.2,.09,"square")); },
  cheer(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.1,.4,.12,"triangle")); }
};

let zhVoice=null;
function findVoice(){
  if(!("speechSynthesis" in window)) return;
  const v=speechSynthesis.getVoices()||[];
  zhVoice = v.find(x=>/^zh[-_]TW/i.test(x.lang)) || v.find(x=>/^zh[-_]HK/i.test(x.lang))
         || v.find(x=>/^zh/i.test(x.lang)) || null;
}
if("speechSynthesis" in window){ findVoice(); speechSynthesis.addEventListener("voiceschanged",findVoice); }
/* 沒有中文語音就完全不唸——絕不用英文腔唸中文 */
function say(t){
  if(!zhVoice) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.voice=zhVoice; u.lang=zhVoice.lang; u.rate=.85; u.pitch=1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}
const D=["零","一","二","三","四","五","六","七","八","九"];
function zh(n){
  if(n<10) return D[n];
  if(n===10) return "十";
  if(n<20) return "十"+D[n%10];
  return D[(n/10)|0]+"十"+(n%10?D[n%10]:"");
}
function sayNum(n){ say(zh(n)); }

/* ═══════════ 小工具 ═══════════ */
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pickN=(a,n)=>shuffle(a.slice()).slice(0,n);
const one=a=>a[Math.random()*a.length|0];
function starSvg(on){
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on?"s-on":"s-off"}"
    d="M12 2.6l2.9 6.1 6.6.9-4.8 4.7 1.2 6.6L12 17.7 6.1 20.9l1.2-6.6L2.5 9.6l6.6-.9z"/></svg>`;
}
function renderStars(){
  const n=GAMES[game].rounds;
  starsEl.innerHTML = n>8                                   /* 題數多就改用進度條，星星塞不下 */
    ? `<span class="prog"><i style="width:${Math.round(step/n*100)}%"></i></span><span class="pnum">${step}/${n}</span>`
    : Array.from({length:n},(_,i)=>starSvg(i<step)).join("");
  starsEl.setAttribute("aria-label",`完成 ${step} / ${n}`);
}
/* ═══════════ 挑戰計時 ═══════════ */
const clockEl=$("#clock");
let clockT=null, clockEnd=0, onTimeUp=null, clockCarry=0;   /* carry＝跨輪接續剩下的秒數 */
function stopClock(){ if(clockT){ clearInterval(clockT); clockT=null; } }
function clockLeft(){ return Math.max(0,Math.ceil((clockEnd-Date.now())/1000)); }
function startClock(sec){
  stopClock(); onTimeUp=null;
  if(!sec){ clockEl.classList.add("hidden"); return; }
  clockEl.classList.remove("hidden");
  clockEnd=Date.now()+sec*1000;
  const tick=()=>{
    const L=clockLeft();
    clockEl.textContent=L+"″";
    clockEl.classList.toggle("hot",L<=10);
    if(L<=0){ stopClock(); const f=onTimeUp; onTimeUp=null; if(f) f(); }
  };
  tick(); clockT=setInterval(tick,200);
}

function nextRound(){
  step++;
  if(step>=GAMES[game].rounds){ renderStars(); finish(); return; }
  renderStars();
  build();
}

/* ═══════════ 遊戲一：連連看（找一樣 / 數量配數字）═══ */
function buildPairs(){
  const isShadow = game==="shadow";
  const isMatch = game==="match"||isShadow;
  const pairs = isMatch?3:4;
  let L,R;
  if(isMatch){
    const items=(qpool[step]&&qpool[step].items) || pickN(ART,pairs);
    L=shuffle(items.slice()).map(v=>({k:v,art:v}));
    R=shuffle(items.slice()).map(v=>({k:v,art:v,shadow:isShadow}));
  }else{
    const q=qpool[step] || {nums:pickN([2,3,4,5,6],pairs), pip:one(PIPS)};
    L=shuffle(q.nums.slice()).map(n=>({k:n,count:n,pip:q.pip}));
    R=shuffle(q.nums.slice()).map(n=>({k:n,num:n}));
  }
  stage.innerHTML=`<div class="pairs"><svg class="wires"></svg><div class="col cl"></div><div class="col cr"></div></div>`;
  const wrap=stage.querySelector(".pairs"), wires=stage.querySelector(".wires");
  const cl=stage.querySelector(".cl"), cr=stage.querySelector(".cr");
  L.forEach((d,i)=>cl.appendChild(mkCard(d,"L",i)));
  R.forEach((d,i)=>cr.appendChild(mkCard(d,"R",i)));

  let locked=[], sel=null, drag=null, activeId=null, downAt=null, moved=false;
  miss=0;
  const COLORS=["var(--berry)","var(--leaf)","var(--grape)","var(--sun)"];
  const box=()=>wrap.getBoundingClientRect();
  const ctr=el=>{const r=el.getBoundingClientRect(),b=box();return{x:r.left-b.left+r.width/2,y:r.top-b.top+r.height/2};};
  const curve=(a,b)=>{const mx=(a.x+b.x)/2;return `M${a.x} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`;};
  const sw=()=>Math.max(6,Math.min(14,box().width*.012));

  function draw(){
    const w=sw(); let s="";
    locked.forEach((p,i)=>{ s+=`<path d="${curve(ctr(p.l),ctr(p.r))}" stroke="${COLORS[i%4]}" stroke-width="${w}"/>`; });
    if(drag) s+=`<path d="${curve(ctr(drag.el),drag.pt)}" stroke="var(--ink-soft)" stroke-width="${w}" stroke-dasharray="${w*1.6} ${w*1.6}" opacity=".55"/>`;
    wires.innerHTML=s;
  }
  function cardAt(x,y){
    for(const e of document.elementsFromPoint(x,y)){ const c=e.closest&&e.closest(".card"); if(c) return c; }
    return null;
  }
  /* 放手時抓最接近的右卡——幼兒手指不會精準 */
  function nearestR(x,y){
    let best=null,bd=Infinity;
    cr.querySelectorAll(".card:not(.done)").forEach(el=>{
      const r=el.getBoundingClientRect();
      const d=Math.hypot(r.left+r.width/2-x, r.top+r.height/2-y);
      if(d<bd){bd=d;best=el;}
    });
    return (best && bd < Math.max(80, box().width*.10)) ? best : null;
  }
  function clearSel(){ if(sel) sel.classList.remove("pick"); sel=null; drag=null; draw(); }
  function resolve(l,r){
    if(L[+l.dataset.i].k===R[+r.dataset.i].k){
      l.classList.remove("pick"); sel=null;
      l.classList.add("done","hit"); r.classList.add("done","hit");
      setTimeout(()=>{l.classList.remove("hit");r.classList.remove("hit");},360);
      locked.push({l,r}); sfx.yes();
      if(isMatch) say(one(PRAISE)); else sayNum(R[+r.dataset.i].num);
      draw();
      if(locked.length===pairs) setTimeout(()=>{
        if(!isMatch){ if(miss===0) maxNum=Math.min(12,maxNum+1); else if(miss>=2) maxNum=Math.max(3,maxNum-1); }
        nextRound();
      },640);
    }else{
      miss++;
      r.classList.add("nudge"); setTimeout(()=>r.classList.remove("nudge"),440);
      sfx.soft(); clearSel();
    }
  }
  function onDown(e){
    if(activeId!==null) return;           /* 只認一根手指，小孩會整隻手壓上來 */
    audio();
    const c=cardAt(e.clientX,e.clientY);
    if(!c||c.classList.contains("done")){ clearSel(); return; }
    activeId=e.pointerId; downAt={x:e.clientX,y:e.clientY}; moved=false;
    if(c.dataset.side==="R"){ if(sel) resolve(sel,c); else sfx.tap(); activeId=null; return; }
    sfx.tap();
    cl.querySelectorAll(".card.pick").forEach(o=>o.classList.remove("pick"));
    sel=c; c.classList.add("pick");
    const b=box();
    drag={el:c,pt:{x:e.clientX-b.left,y:e.clientY-b.top}};
    draw();
  }
  function onMove(e){
    if(e.pointerId!==activeId||!drag) return;
    if(downAt && Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>12) moved=true;
    const b=box(); drag.pt={x:e.clientX-b.left,y:e.clientY-b.top}; draw();
  }
  function onUp(e){
    if(e.pointerId!==activeId) return;
    if(drag){
      const t = moved ? (cardAt(e.clientX,e.clientY)||nearestR(e.clientX,e.clientY)) : null;
      const l=drag.el; drag=null;
      if(t && t.dataset.side==="R" && !t.classList.contains("done")) resolve(l,t);
      else if(moved) clearSel();          /* 拖到空白：安靜收線，維持「沒有錯」 */
      draw();
    }
    activeId=null; downAt=null; moved=false;
  }
  wrap.addEventListener("pointerdown",onDown);
  wrap.addEventListener("pointermove",onMove);
  wrap.addEventListener("pointerup",onUp);
  wrap.addEventListener("pointercancel",onUp);
  requestAnimationFrame(draw);
  window.addEventListener("resize",draw);          /* 轉向時只重畫線，不重出題 */
  return ()=>window.removeEventListener("resize",draw);
}
function mkCard(d,side,i){
  const el=document.createElement("div");
  el.className="card"; el.dataset.side=side; el.dataset.i=i;
  el.style.transform=`rotate(${(i%2?1:-1)*(.8+Math.random()*1.1)}deg)`;
  if(d.art!==undefined)      el.innerHTML=`<span class="art${d.shadow?" shadow":""}">${d.art}</span>`;
  else if(d.num!==undefined) el.innerHTML=`<span class="num">${d.num}</span>`;
  else el.innerHTML=`<span class="pips" style="grid-template-columns:repeat(${d.count<=6?Math.min(3,d.count):(d.count<=12?4:5)},1fr)">`+
       Array.from({length:d.count},()=>`<span>${d.pip}</span>`).join("")+`</span>`;
  return el;
}

/* ═══════════ 遊戲二：點點畫 ═══════════ */
/* 50 隻怪獸不可能一隻一隻手繪，改用參數生成：極座標半徑隨角度起伏，
   花瓣數、振幅、尖或圓、扁或長各自隨機 → 每次都是沒看過的輪廓。
   前幾題先用手繪的魚／蝴蝶／貓／龍當暖身，之後點數從 10 長到 30。 */
/* 怪獸不是隨機的圓形，是照身體構造描出來的：
   鼻尖→額頭→角→後腦→頸→肩→背（翅膀／砲管／棘刺／背鰭）→臀→尾巴→後腳→肚子→前腳→胸。
   每種原型有自己的特徵，連完才認得出是什麼。尺寸與棘刺數量隨機微調，不會兩隻一樣。 */
const ARCH=[
  {n:"火翼龍",e:"🐉",plan:"beast",wing:1,horn:1,back:"smooth", tail:"spike"},
  {n:"雷鳥",  e:"⚡",plan:"bird",  crest:1, tail:"fan"},
  {n:"海龍",  e:"🌊",plan:"serp",  fin:1,   horn:1},
  {n:"砲甲龜",e:"🐢",plan:"beast",wing:0,horn:0,back:"cannons",tail:"ball"},
  {n:"冰角獸",e:"❄️",plan:"beast",wing:0,horn:2,back:"plates", tail:"spike"},
  {n:"刺背龍",e:"🦕",plan:"beast",wing:0,horn:0,back:"spikes", tail:"long"},
  {n:"聖鹿",  e:"🦌",plan:"beast",wing:0,horn:3,back:"smooth", tail:"ball"},
  {n:"翼蝠獸",e:"🦇",plan:"bird",  crest:0, tail:"fin"},
  {n:"鰭水獸",e:"🐟",plan:"serp",  fin:2,   horn:0},
  {n:"甲蟲獸",e:"🪲",plan:"beast",wing:0,horn:1,back:"plates", tail:"ball"}
];
function genCreature(i){
  const A=ARCH[i%ARCH.length], J=a=>(Math.random()-.5)*a;
  if(A.plan==="bird")  return genBird(A,i,J);
  if(A.plan==="serp")  return genSerp(A,i,J);
  const want=Math.max(12,Math.min(30, 12+Math.round((i-4)/45*18)));
  const full=want>=20, spikeN=Math.max(1,Math.min(5,Math.round((want-13)/3)));
  const gy=.88, by0=.40+J(.06), by1=.70+J(.04);
  const hr=.085+J(.02), hx=.20+J(.03), hy=.30+J(.05);
  const p=[], push=(x,y)=>p.push([Math.max(.02,Math.min(.98,x)),Math.max(.02,Math.min(.98,y))]);

  push(hx-hr*1.3, hy+hr*.3);                       /* 鼻尖 */
  push(hx-hr*.8,  hy-hr*.9);                       /* 額頭 */
  if(A.horn===1){ push(hx-hr*.1, hy-hr*2.4); push(hx+hr*.35, hy-hr*1.0); }
  else if(A.horn===2){ push(hx-hr*.4,hy-hr*2.2); push(hx,hy-hr*1.1); push(hx+hr*.4,hy-hr*2.2); push(hx+hr*.7,hy-hr*1.0); }
  else if(A.horn===3){                             /* 鹿角：分岔 */
    push(hx-hr*.5,hy-hr*2.0); push(hx-hr*.9,hy-hr*2.9); push(hx-hr*.2,hy-hr*2.5);
    push(hx+hr*.3,hy-hr*3.1); push(hx+hr*.5,hy-hr*2.1); push(hx+hr*.8,hy-hr*1.0);
  }
  else push(hx+hr*.3, hy-hr*1.05);
  push(hx+hr*1.05, hy-hr*.2);                      /* 後腦 */
  push(hx+hr*1.2,  hy+hr*1.0);                     /* 頸 */
  push(.36, by0+.02);                              /* 肩 */

  let bx=.40;
  if(A.wing){                                      /* 翅膀：兩個翼尖＋中間的凹 */
    push(.43, by0-.02);
    push(.47, .12+J(.04)); push(.60, .20+J(.04));
    push(.55, .31);        push(.67, .28+J(.03));
    push(.63, by0-.02);
    bx=.66;
  }
  if(A.back==="spikes"){                           /* 背棘 */
    const w=(.76-bx)/spikeN;
    for(let k=0;k<spikeN;k++){
      push(bx+w*k+w*.5, by0-.10-J(.03));
      push(bx+w*(k+1),  by0+.01);
    }
  }else if(A.back==="cannons"){                    /* 背上兩根砲管 */
    [0,1].forEach(k=>{
      const x=bx+.06+k*.17;
      push(x, by0-.01); push(x-.02, by0-.20-J(.03));
      push(x+.09, by0-.22-J(.03)); push(x+.10, by0-.02);
    });
  }else if(A.back==="plates"){                     /* 背甲 */
    const n=Math.max(2,Math.min(3,spikeN));
    const w=(.76-bx)/n;
    for(let k=0;k<n;k++){ push(bx+w*k+w*.5, by0-.06); push(bx+w*(k+1), by0+.02); }
  }else if(A.back==="fin"){                        /* 背鰭 */
    push(.50, by0-.20); push(.62, by0-.16); push(.70, by0+.01);
  }
  push(.79, by0+.06);                              /* 臀 */

  if(A.tail==="spike"){ push(.94, by0-.03); push(.86, by0+.13); }
  else if(A.tail==="long"){ push(.90, by0-.07); push(.98, by0+.03); push(.88, by0+.12); }
  else if(A.tail==="fin"){ push(.88, by0-.11); push(.97, by0-.02); push(.94, by0+.11); push(.85, by0+.13); }
  else { push(.89, by0-.04); push(.95, by0+.03); push(.88, by0+.11); }

  if(full){ push(.72, by1); push(.72, gy); push(.62, gy); push(.61, by1); }   /* 後腳 */
  else { push(.72, gy); push(.62, gy); }
  push(.47, by1+.02);                              /* 肚子 */
  if(full){ push(.37, by1); push(.37, gy); push(.27, gy); push(.26, by1-.01); }/* 前腳 */
  else { push(.37, gy); push(.27, gy); }
  push(.22, by1-.11);                              /* 胸 */
  push(hx-hr*1.05, hy+hr*1.5);
  return {n:A.n, e:A.e, p, meta:{eye:[hx-hr*.45, hy-hr*.15], mouth:[hx-hr*.9, hy+hr*.55]}};
}
/* 鳥型：喙、冠羽、兩片大展翅、扇尾、細腳 */
function genBird(A,i,J){
  const p=[], push=(x,y)=>p.push([Math.max(.02,Math.min(.98,x)),Math.max(.02,Math.min(.98,y))]);
  const hy=.36+J(.05), gy=.88;
  push(.05, hy+.03);                               /* 喙尖 */
  push(.14, hy-.04);
  if(A.crest){ push(.16,hy-.16-J(.04)); push(.22,hy-.07); push(.25,hy-.17-J(.04)); }
  push(.24, hy+.01);                               /* 後腦 */
  push(.27, hy+.09);                               /* 肩 */
  push(.31, .10+J(.04)); push(.50, .17+J(.04));    /* 近翼 */
  push(.43, .40);
  push(.54, .36);
  push(.60, .12+J(.04)); push(.80, .20+J(.04));    /* 遠翼 */
  push(.72, .44);
  if(A.tail==="fan"){ push(.86,.38); push(.97,.44+J(.04)); push(.95,.58); push(.84,.56); }
  else { push(.88,.40); push(.96,.52); push(.86,.58); }
  push(.66, .62);                                  /* 身體下緣 */
  push(.54, .62); push(.54, gy); push(.46, gy); push(.45, .62);   /* 腳 */
  push(.30, .56);                                  /* 胸 */
  push(.12, hy+.12);
  return {n:A.n, e:A.e, p, meta:{eye:[.15, hy]}};
}
/* 蛇型：長長的波浪身體，頭上有角或背鰭 */
function genSerp(A,i,J){
  const p=[], push=(x,y)=>p.push([Math.max(.02,Math.min(.98,x)),Math.max(.02,Math.min(.98,y))]);
  const n=5+(i%3), th=.085+J(.02), amp=.15+J(.05), y0=.48;
  const wave=x=>y0+Math.sin((x-.2)*7.2)*amp;
  push(.05, wave(.05)+.02);                        /* 鼻尖 */
  push(.11, wave(.11)-th*1.1);                     /* 頭頂 */
  if(A.horn){ push(.15, wave(.15)-th*2.6); push(.20, wave(.20)-th*1.2); }
  for(let k=0;k<=n;k++){                           /* 背 */
    const x=.24+(.92-.24)*k/n;
    if(A.fin===2 && k%2===1) push(x, wave(x)-th-.10);   /* 背鰭 */
    push(x, wave(x)-th);
  }
  push(.97, wave(.97));                            /* 尾尖 */
  for(let k=n;k>=0;k--){                           /* 腹 */
    const x=.24+(.92-.24)*k/n;
    push(x, wave(x)+th);
  }
  push(.10, wave(.10)+th*1.2);
  return {n:A.n, e:A.e, p, meta:{eye:[.13, wave(.13)-th*.25]}};
}
/* 2 歲的連成車：五種車身側面輪廓（含賽車的低扁車身與尾翼），
   點數多的版本會多出輪拱，看起來更像車。 */
const VEH=[
  {n:"轎車",e:"🚗",top:[[.08,.70],[.10,.56],[.26,.54],[.36,.34],[.64,.32],[.78,.54],[.92,.56],[.92,.70]]},
  {n:"賽車",e:"🏎️",top:[[.05,.70],[.05,.60],[.30,.58],[.38,.46],[.54,.44],[.62,.56],[.78,.54],
                        [.78,.33],[.96,.31],[.96,.45],[.87,.47],[.93,.70]]},
  {n:"卡車",e:"🚚",top:[[.06,.70],[.06,.46],[.14,.44],[.20,.30],[.36,.30],[.36,.46],[.44,.46],[.44,.26],[.94,.26],[.94,.70]]},
  {n:"巴士",e:"🚌",top:[[.06,.70],[.06,.34],[.14,.26],[.88,.26],[.94,.34],[.94,.70]]},
  {n:"小貨車",e:"🛻",top:[[.06,.70],[.06,.50],[.18,.48],[.26,.32],[.46,.32],[.52,.48],[.94,.48],[.94,.70]]}
];
function genVehicle(i){
  const T=VEH[i%VEH.length], J=a=>(Math.random()-.5)*a;
  const want=7+Math.round((i%50)/49*9);
  const p=T.top.map(([x,y])=>[x+J(.02), y+J(.03)]);
  if(want>=10){                                    /* 輪拱：車子底下兩個輪子 */
    [[.74,.70],[.70,.80],[.60,.80],[.56,.70],[.38,.70],[.34,.80],[.24,.80],[.20,.70]]
      .forEach(([x,y])=>p.push([x+J(.015), y]));
  }
  /* 完成後補的細節：輪子（有輪拱就放在輪拱裡）、車窗 */
  const wheels = want>=10 ? [[.29,.78],[.65,.78]] : [[.30,.72],[.72,.72]];
  const WIN={ "轎車":[[.40,.38,.60,.52]], "賽車":[[.42,.47,.52,.55]], "卡車":[[.22,.33,.34,.44]], "巴士":[[.14,.32,.30,.46],[.38,.32,.54,.46],[.62,.32,.78,.46]], "小貨車":[[.28,.35,.44,.46]] };
  return {n:T.n, e:T.e, p, meta:{wheels, win:WIN[T.n]||[]}};
}

/* 三個遊戲都是「圖庫 50 題，每次開始隨機抽 5 題」，抽完由易到難排好 */
let qpool=[];
function buildPool(id){
  if(id==="link"){
    const all=[];
    for(let i=0;i<50;i++){
      const hi=Math.min(12, 4+Math.round(i/49*8)), lo=Math.max(1,hi-3), pool=[];
      for(let v=lo;v<=hi;v++) pool.push(v);
      all.push({nums:pickN(pool,4), pip:one(PIPS)});
    }
    return shuffle(all).slice(0,5).sort((a,b)=>Math.max(...a.nums)-Math.max(...b.nums));
  }
  if(id==="plus"){
    const all=[];
    for(let i=0;i<50;i++){
      const tot=3+Math.round(i/49*16), a=1+(Math.random()*(tot-1)|0);
      all.push({a, b:tot-a});
    }
    return shuffle(all).slice(0,5).sort((x,y)=>(x.a+x.b)-(y.a+y.b));
  }
  if(id==="match"||id==="shadow"){                 /* 50 種三台車的組合，抽 5 題 */
    const all=[]; for(let i=0;i<50;i++) all.push({items:pickN(ART,3)});
    return shuffle(all).slice(0,5);
  }
  if(id==="tally"){                                /* 50 種「幾台什麼車」，抽 5 題 */
    const all=[];
    for(let i=0;i<50;i++) all.push({n:1+(i%5), art:one(CRITTER)});
    return shuffle(all).slice(0,5).sort((a,b)=>a.n-b.n);
  }
  if(id==="dotsS"){                                /* 50 台車，抽 5 台 */
    const all=SHAPES.bear.slice();
    for(let i=all.length;i<50;i++) all.push(genVehicle(i));
    const pick=[], seen=new Set();
    shuffle(all).forEach(s=>{ if(pick.length<5 && !seen.has(s.n)){ seen.add(s.n); pick.push(s); } });
    return pick.sort((a,b)=>a.p.length-b.p.length);
  }
  if(id==="dotsL"){
    const all=SHAPES.rabbit.slice();
    for(let i=all.length;i<50;i++) all.push(genCreature(i));
    /* 一局 5 隻不能重複種類，不然會連出兩隻一樣的 */
    const pick=[], seen=new Set();
    shuffle(all).forEach(s=>{ if(pick.length<5 && !seen.has(s.n)){ seen.add(s.n); pick.push(s); } });
    return pick.sort((a,b)=>a.p.length-b.p.length);
  }
  return [];
}

/* 封閉的 Catmull-Rom 曲線：把折線變成平滑的輪廓 */
function spline(pts){
  const n=pts.length; let d="M"+pts[0][0]+" "+pts[0][1];
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d+" Z";
}

      s.classList.add("lit"); sfx.step(i+1); sayNum(i+1);

/* ═══════════ 共用：單指拖曳 ═══════════ */
/* 回傳 onDrop(元素, 放手時的 x, y, 放回原位的函式) */
function dragify(box, sel, onDrop, multi){
  const act=new Map();                          /* pointerId → 正在拖的東西 */
  function down(e){
    if(!multi && act.size) return;              /* 單人模式只認一根手指（小孩會整隻手壓上來）*/
    if(act.has(e.pointerId)) return;
    const t=e.target.closest(sel);
    if(!t || t.classList.contains("set") || t.dataset.busy==="1") return;
    audio(); sfx.tap();
    const r=t.getBoundingClientRect();
    t.dataset.busy="1";
    act.set(e.pointerId,{el:t,
      ox:parseFloat(t.style.left), oy:parseFloat(t.style.top),
      dx:e.clientX-(r.left+r.width/2), dy:e.clientY-(r.top+r.height/2)});
    t.classList.add("grab"); t.classList.remove("tip");
    try{ box.setPointerCapture(e.pointerId); }catch(err){}
  }
  function move(e){
    const a=act.get(e.pointerId); if(!a) return;
    const b=box.getBoundingClientRect();
    a.el.style.left=(e.clientX-b.left-a.dx)+"px";
    a.el.style.top =(e.clientY-b.top -a.dy)+"px";
  }
  function up(e){
    const a=act.get(e.pointerId); if(!a) return;
    act.delete(e.pointerId);
    const b=box.getBoundingClientRect(), cur=a.el, bx=a.ox, by=a.oy;
    cur.classList.remove("grab"); delete cur.dataset.busy;
    onDrop(cur, e.clientX-b.left, e.clientY-b.top,
           ()=>{ cur.style.left=bx+"px"; cur.style.top=by+"px"; });
  }
  box.addEventListener("pointerdown",down);
  box.addEventListener("pointermove",move);
  box.addEventListener("pointerup",up);
  box.addEventListener("pointercancel",up);
}
const inRect=(x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.h+r.y;

/* ═══════════ 遊戲五：挑豆子 ═══════════ */
function buildSort(){
  const big = game==="sortL";
  const n = big?sortCfg.n:8;
  /* 數量多的時候不要太懸殊，兩邊都要有得數 */
  const nr = n>14 ? Math.round(n*(0.35+Math.random()*0.3))
                  : Math.max(2, Math.min(n-2, 2+Math.random()*(n-3)|0));
  const kinds = shuffle(Array.from({length:n},(_,i)=>i<nr?"r":"g"));

  const cars=!big;                                                  /* 2 歲＝停車場，5 歲＝分樹果 */
  const LB = cars?["紅色車位","藍色車位"]:["火系 🔥","草系 🌿"];
  stage.innerHTML=`<div class="sortw${cars?" cars":""}"><div class="bowl"></div>
      <div class="plate" data-t="r"><span class="tag">${LB[0]}</span></div>
      <div class="plate" data-t="g"><span class="tag">${LB[1]}</span></div></div>`;
  const box=stage.querySelector(".sortw");
  const W=box.clientWidth, H=box.clientHeight;
  const dens=Math.sqrt(12/n);                                       /* 顆數越多、每顆越小 */
  let S=Math.max(15,Math.min(46, Math.min(W,H)*0.062*dens));
  if(cars) S*=1.8;                                                  /* 2 歲版的車子放大一倍 */
  const BW=cars?S*1.55:S;                                           /* 一台車比一顆果寬 */

  const bowl={x:W*.16,y:H*.02,w:W*.68,h:H*.44};
  const pw=Math.min(W*.40, H*.46), ph=Math.min(H*.40, pw*.8);
  const plates={
    r:{x:W*.06,          y:H-ph-H*.03, w:pw, h:ph},
    g:{x:W*.94-pw,       y:H-ph-H*.03, w:pw, h:ph}
  };
  const bowlEl=box.querySelector(".bowl");
  Object.assign(bowlEl.style,{left:bowl.x+"px",top:bowl.y+"px",width:bowl.w+"px",height:bowl.h+"px"});
  box.querySelectorAll(".plate").forEach(p=>{
    const r=plates[p.dataset.t];
    Object.assign(p.style,{left:r.x+"px",top:r.y+"px",width:r.w+"px",height:r.h+"px"});
  });

  /* 豆子散在碗裡，盡量不重疊 */
  const put=[];
  kinds.forEach((t,i)=>{
    let x,y,ok=false;
    for(let k=0;k<24&&!ok;k++){
      x=bowl.x+BW*.6+Math.random()*(bowl.w-BW*1.2);
      y=bowl.y+S+Math.random()*(bowl.h-S*2.2);
      ok=put.every(p=>Math.hypot(p[0]-x,p[1]-y)>BW*.92);
    }
    put.push([x,y]);
    const b=document.createElement("div");
    b.className=cars?"bean car":"bean"; b.dataset.t=t; b.dataset.i=i; b.dataset.in="";
    b.style.cssText=cars
      ? `left:${x}px;top:${y}px;width:${BW}px;height:${S*.92}px;--wd:${BW*.42}px;--r:${(Math.random()*16-8)|0}deg`
      : `left:${x}px;top:${y}px;width:${S}px;height:${S*.82}px;--r:${(Math.random()*60-30)|0}deg`;
    box.appendChild(b);
  });

  /* 盤子是橢圓，把落點收進盤內 0.84 的範圍，其餘位置隨他放、可以互相疊 */
  function intoPlate(t,x,y){
    const p=plates[t], cx=p.x+p.w/2, cy=p.y+p.h/2;
    const rx=p.w/2-BW*.55, ry=p.h/2-S*.5;
    const dx=(x-cx)/rx, dy=(y-cy)/ry, d=Math.hypot(dx,dy);
    if(d<=.86) return [x,y];
    const k=.86/d;
    return [cx+dx*rx*k, cy+dy*ry*k];
  }
  let z=10;
  function sortedAll(){
    return [...box.querySelectorAll(".bean")].every(b=>b.dataset.in===b.dataset.t);
  }
  dragify(box,".bean",(el,x,y,back)=>{
    const t=el.dataset.t;
    const hit = inRect(x,y,plates.r)?"r" : inRect(x,y,plates.g)?"g" : null;
    el.style.zIndex=++z;                                     /* 後放的疊在上面 */
    if(hit && hit!==t){                                      /* 放錯盤：彈回原處 */
      back(); el.classList.add("wob"); setTimeout(()=>el.classList.remove("wob"),440);
      sfx.soft(); return;
    }
    if(hit===t){
      const [px,py]=intoPlate(t,x,y);
      el.style.left=px+"px"; el.style.top=py+"px";
      el.dataset.in=t; sfx.yes();
      if(sortedAll()) setTimeout(()=>{ if(sortedAll()) finishSort(); },600);
    }else{                                                   /* 放在盤外：就停在那裡 */
      el.style.left=Math.max(BW*.6,Math.min(W-BW*.6,x))+"px";
      el.style.top =Math.max(S,Math.min(H-S,y))+"px";
      el.dataset.in="";
    }
  });

  const timers=[];
  const lockAll=()=>box.querySelectorAll(".bean").forEach(b=>b.classList.add("set"));

  /* 限時到了：停下來，算分好了幾顆 */
  if(big && sortCfg.sec) onTimeUp=()=>{
    lockAll(); timers.forEach(clearTimeout); sfx.fall();
    const done=box.querySelectorAll('.bean[data-in="r"],.bean[data-in="g"]').length;
    const note=document.createElement("div");
    note.className="tape-note";
    note.innerHTML=`<div class="l1">分好 ${done} / ${n} 顆</div><div class="l2">時間到！</div>`;
    box.appendChild(note); say("時間到");
    setTimeout(()=>finish("時間到！","這次分好 "+done+" 顆"),2100);
  };

  function finishSort(){
    lockAll();                                                        /* 開始結算就不能再動 */
    /* 這一輪結束先暫停計時，剩下的秒數留給下一輪 */
    const bonus = (big&&sortCfg.sec) ? clockLeft() : 0;
    clockCarry=bonus; stopClock(); onTimeUp=null;
    if(!big){ sfx.cheer(); say("分好了"); timers.push(setTimeout(nextRound,1200)); return; }
    /* 小兔版：分完逐顆點亮報數，再比多少。顆數多就數快一點，也不逐顆唸 */
    const gap = n<=14?560 : (n<=30?240:140), voice = n<=14;
    const R=[...box.querySelectorAll('.bean[data-t="r"]')], G=[...box.querySelectorAll('.bean[data-t="g"]')];
    [...R,...G].forEach(b=>b.classList.add("dim"));
    const seq=[...R.map(b=>[b,"r"]),...G.map(b=>[b,"g"])];
    let cr=0,cg=0;
    seq.forEach(([b,t],i)=>timers.push(setTimeout(()=>{
      b.classList.add("lit");
      const k = t==="r" ? ++cr : ++cg;
      sfx.step(k); if(voice) sayNum(k);
    }, i*gap)));
    const end=seq.length*gap;
    timers.push(setTimeout(()=>{
      const more = nr>n-nr ? "火果比較多" : (nr<n-nr ? "草果比較多" : "一樣多");
      const note=document.createElement("div");
      note.className="tape-note";
      note.innerHTML=`<div class="l1">🔥 ${nr} ・ 🌿 ${n-nr}</div><div class="l2">${more}</div>`+
        (bonus?`<div class="l3">還剩 ${bonus} 秒！</div>`:"");
      box.appendChild(note);
      sfx.cheer(); say(more);
    }, end+400));
    timers.push(setTimeout(nextRound, end+2600));
  }
  return ()=>{ timers.forEach(clearTimeout); onTimeUp=null; };
}

/* ═══════════ 遊戲六：疊高高 / 疊玩具 ═══════════
   玩具的重心不在正中間，底面也不一樣寬——方塊版一看就知道要放中間，
   玩具版只能自己試：氣球站不住（底是那條線）、球上面幾乎放不了東西、
   大象很重（放上層會把整座塔的重心拉過去）。
   s=大小、bw/bx=底面寬與偏移、tw/tx=可以放東西的上面、m=重量、c=重心偏移 */
const TOYS=[
  {e:"🗿",n:"岩石怪",s:1.10,bw:.85,bx:0,  tw:.70,tx:0,   m:8,  c:0},
  {e:"🐢",n:"龜怪",  s:1.05,bw:.85,bx:0,  tw:.55,tx:0,   m:4,  c:0},
  {e:"🐲",n:"龍",    s:1.35,bw:.70,bx:0,  tw:.45,tx:.04, m:7,  c:.03},
  {e:"🦖",n:"暴龍",  s:1.25,bw:.55,bx:-.04,tw:.40,tx:-.05,m:6, c:-.04},
  {e:"🐙",n:"章魚怪",s:1.05,bw:.80,bx:0,  tw:.35,tx:0,   m:3,  c:0},
  {e:"🍄",n:"菇怪",  s:0.95,bw:.32,bx:0,  tw:.72,tx:0,   m:2,  c:0},
  {e:"🦊",n:"火狐",  s:1.00,bw:.55,bx:0,  tw:.42,tx:0,   m:3,  c:0},
  {e:"🥚",n:"蛋",    s:0.85,bw:.22,bx:0,  tw:.22,tx:0,   m:2,  c:0},
  {e:"⚡",n:"電球",  s:0.85,bw:.16,bx:0,  tw:.30,tx:0,   m:1,  c:0},
  {e:"🐝",n:"蜂怪",  s:0.80,bw:.28,bx:0,  tw:.38,tx:0,   m:1,  c:0}
];

function buildStack(){
  const toy = game==="stackL";
  const TOPPLE = toy;                    /* 玩具版重心偏了會真的垮；小熊積木版只晃不倒 */
  const cnt = toy?6:5;
  const COL=["#E8556D","#FFC43D","#3FA796","#7B5EA7","#5C9BD1","#E8845A","#7CB342","#C2568F"];

  stage.innerHTML=`<div class="stackw"><div class="ground"></div></div>`;
  const box=stage.querySelector(".stackw");
  const W=box.clientWidth, H=box.clientHeight;
  const pileTop=H*0.62;                                   /* 這條線以上就算放到塔上 */
  const baseY=pileTop-8;
  Object.assign(box.querySelector(".ground").style,
    {left:(W*.04)+"px",top:baseY+"px",width:(W*.92)+"px"});

  /* ── 每一件的力學資料（單位都換算成 px）── */
  let P;
  if(toy){
    const defs=pickN(TOYS,cnt);
    if(!defs.some(d=>d.bw>=.8)) defs[0]=TOYS[0];          /* 保證至少有一個站得穩的底座 */
    const sumH=defs.reduce((a,d)=>a+d.s*.84,0);
    const U=Math.max(46, Math.min(W/6.2,(pileTop-26)/sumH,116));
    P=defs.map((d,i)=>({k:i,d,w:d.s*U,h:d.s*U*.84,
      bw:d.bw*d.s*U, bx:d.bx*d.s*U, tw:d.tw*d.s*U, tx:d.tx*d.s*U, m:d.m, c:d.c*d.s*U}));
  }else{
    const h=Math.max(20,Math.min(46,(pileTop-16)/cnt));
    const wide=Math.min(W*.52,420);
    P=Array.from({length:cnt},(_,i)=>{
      const w=Math.round(wide*(1-0.58*(i/(cnt-1))));
      return {k:i,w,h,bw:w,bx:0,tw:w,tx:0,m:w,c:0,col:COL[i%COL.length]};
    });
  }

  /* ── 料堆：縮小排在下方，換行置中 ── */
  const SC=toy?0.72:0.58, gap=12;
  const rows=[]; let row=[], used=0;
  shuffle(P.slice()).forEach(p=>{
    const ww=p.w*SC;
    if(used+ww+gap>W*.94 && row.length){ rows.push({row,used}); row=[]; used=0; }
    row.push(p); used+=ww+gap;
  });
  if(row.length) rows.push({row,used});
  let oy=pileTop+10;
  rows.forEach(R=>{
    const rh=Math.max(...R.row.map(p=>p.h))*SC+10;
    let x=(W-(R.used-gap))/2;
    R.row.forEach(p=>{
      const ww=p.w*SC, ox=x+ww/2, cy=oy+rh/2;
      const el=document.createElement("div");
      el.className=toy?"blk toy":"blk box"; el.dataset.k=p.k;
      el.dataset.ox=ox; el.dataset.oy=cy; el.dataset.sc=SC;    /* 垮下來要回到這裡 */
      el.style.cssText=`left:${ox}px;top:${cy}px;width:${p.w}px;height:${p.h}px;--sc:${SC};`+
        (toy?"":`background:${p.col};--wd:${p.w*.62}px`);
      if(toy) el.innerHTML=
        `<span class="em" style="font-size:${p.w*.98}px">${p.d.e}</span>`+
        `<span class="cap" style="width:${p.tw}px;margin-left:${p.tx}px"></span>`+
        `<span class="foot" style="width:${p.bw}px;margin-left:${p.bx}px"></span>`;
      box.appendChild(el);
      p.el=el; x+=ww+gap;
    });
    oy+=rh;
  });

  /* ── 「會不會倒」的物理：上面所有東西的合重心，要落在下面那件的支撐面內 ── */
  const tower=[];                        /* 由下而上 {p,x} */
  let busy=false, stackTop=baseY;
  const OVER=toy?0.42:0.22;              /* 底面要壓到下面那件上面多少比例才算搭上（小熊版放寬）*/
  const WARN=0.66;                       /* 重心偏到支撐面一半的 66% 就開始晃 */
  const capSpan=b=>[b.x+b.p.tx-b.p.tw/2, b.x+b.p.tx+b.p.tw/2];
  const footSpan=b=>[b.x+b.p.bx-b.p.bw/2, b.x+b.p.bx+b.p.bw/2];
  function com(from){
    let m=0,sx=0;
    for(let j=from;j<tower.length;j++){ m+=tower[j].p.m; sx+=tower[j].p.m*(tower[j].x+tower[j].p.c); }
    return sx/m;
  }
  function balance(){
    let fail=-9, worst=0;
    if(tower.length){                    /* 先看整座塔站不站得住（最底下那件的底面）*/
      const [a,b]=footSpan(tower[0]);
      const off=Math.abs(com(0)-(a+b)/2)/((b-a)/2);
      worst=off; if(off>1.02) fail=-1;   /* -1 = 連最底下都撐不住，整座垮 */
    }
    for(let i=0;i<tower.length-1;i++){
      const [a,b]=capSpan(tower[i]);
      const off=Math.abs(com(i+1)-(a+b)/2)/((b-a)/2);
      if(off>worst) worst=off;
      if(off>1.02 && fail===-9) fail=i;
    }
    return {fail,worst};
  }
  function reflow(){
    stackTop=baseY;
    tower.forEach(b=>{ b.el.style.top=(stackTop-b.p.h/2)+"px"; stackTop-=b.p.h; });
  }
  function toPile(el){
    el.classList.remove("set","fall");
    el.style.left=el.dataset.ox+"px"; el.style.top=el.dataset.oy+"px";
    el.style.setProperty("--sc",el.dataset.sc);
    el.style.removeProperty("--fx"); el.style.removeProperty("--fy"); el.style.removeProperty("--fr");
    el.style.zIndex="";
  }
  function showCom(x,y){                 /* 倒了才揭曉：重心原來在這裡 */
    const m=document.createElement("div");
    m.className="compin"; m.style.left=x+"px"; m.style.top=(y-58)+"px";
    m.innerHTML=`<div class="bar"></div><div class="dot"></div><div class="lb">重心</div>`;
    box.appendChild(m);
    setTimeout(()=>m.remove(),1900);
  }
  function topple(from){
    busy=true; sfx.fall();
    const supY = from<0 ? baseY : (parseFloat(tower[from].el.style.top)-tower[from].p.h/2);
    const cx = com(from<0?0:from+1);
    const gone=tower.splice(from<0?0:from+1);
    const dir = cx < (tower.length?tower[tower.length-1].x:W/2) ? -1 : 1;
    gone.forEach((b,i)=>{
      b.el.style.setProperty("--fx",(dir*(80+i*50))+"px");
      b.el.style.setProperty("--fy",(baseY-parseFloat(b.el.style.top)+b.p.h/2)+"px");
      b.el.style.setProperty("--fr",(dir*(45+i*30))+"deg");
      b.el.classList.add("fall");
    });
    showCom(cx,supY); say("重心跑出去了");
    setTimeout(()=>{ gone.forEach(b=>toPile(b.el)); reflow(); busy=false; },800);
  }
  function shake(){
    tower.forEach(b=>{ b.el.classList.add("shake"); setTimeout(()=>b.el.classList.remove("shake"),520); });
    sfx.soft();
  }

  dragify(box,".blk",(el,x,y,back)=>{
    if(busy){ back(); return; }
    if(y>pileTop){ back(); return; }                       /* 沒舉到上面：安靜放回 */
    const p=P[+el.dataset.k];
    let cx=Math.max(p.w/2+4, Math.min(W-p.w/2-4, x));
    const lvl=tower.length;
    if(lvl){
      const t=tower[lvl-1], [ta,tb]=capSpan(t);
      const a=cx+p.bx-p.bw/2, b=cx+p.bx+p.bw/2;
      const ov=Math.min(b,tb)-Math.max(a,ta);
      if(TOPPLE){
        if(ov < Math.min(b-a, tb-ta)*OVER){                /* 根本沒搭到：滑下去 */
          back(); el.classList.add("wob"); setTimeout(()=>el.classList.remove("wob"),440);
          sfx.soft(); return;
        }
      }else{
        /* 小熊版永遠不會失敗：放歪了就自己滾到下面那塊上面 */
        const tc=(ta+tb)/2, lim=(tb-ta)*.35;
        cx=Math.max(tc-lim,Math.min(tc+lim,cx))-p.bx;
        cx=cx+(tc-p.bx-cx)*0.45;
      }
    }
    el.style.left=cx+"px";
    el.style.setProperty("--sc","1");
    el.style.zIndex=String(20+lvl);
    el.classList.add("set");
    tower.push({el,p,x:cx});
    reflow();
    sfx.step(lvl+1); sayNum(lvl+1);

    const {fail,worst}=balance();
    if(TOPPLE && fail!==-9){ setTimeout(()=>topple(fail),300); return; }
    if(worst>WARN) setTimeout(shake,240);
    if(tower.length===cnt) setTimeout(()=>{
      sfx.cheer(); say("疊了"+zh(cnt)+"層");
      setTimeout(nextRound,1500);
    },500);
  });
  return null;
}

/* ═══════════ 遊戲七：記憶翻牌 ═══════════ */

      const x=a,y=b; a=b=null;
